<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>광맥전선</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10151f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 레이아웃: 전장이 화면을 채우고, 위아래 금속 콘솔이 조작부가 된다. 한 가지 다크 룩으로 고정한다. */
:root{color-scheme:dark;
  --ink:#10151f;--panel:#1b2433;--panel2:#26324a;--line:#46587a;--brass:#d2a85a;--text:#e8edf5;--dim:#9fb0c8;
  --ore:#ffc247;--gas:#ea7be0;--ok:#58e08a;--warn:#f2c14e;--bad:#ee5545;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"Chakra Petch","IBM Plex Sans KR",monospace;
  --cut:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden}
#kr-app{height:100%}
.k-game{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;font-size:14px}
.k-game button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);cursor:pointer;padding:6px 10px;touch-action:manipulation}
.k-game button:hover{border-color:var(--brass)}
.k-game button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.k-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border-bottom:2px solid var(--brass);padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.k-res{display:flex;gap:14px;flex:none}
/* 상단 바 줄 수 고정: 숫자·버튼 글자가 바뀌어도 폭이 변하지 않게 칸 폭을 정한다(폭이 변하면 메뉴가 2줄↔1줄로 계속 바뀌었다) */
.k-chip b{display:inline-block;min-width:5.6ch;white-space:nowrap}.k-chip.sup b{min-width:7.8ch}
.k-clock{flex:none;min-width:5.8ch}
.k-tools button{white-space:nowrap}#k-idlen{display:inline-block;min-width:2.4ch;text-align:center}
#k-speed{min-width:5.2em}#k-mute{min-width:5.2em}#k-voicebtn{min-width:6.6em}#k-pause{min-width:3.6em}
.k-chip{display:inline-flex;align-items:center;gap:6px;font:700 17px var(--num);font-variant-numeric:tabular-nums}
.k-chip i{width:13px;height:13px;display:block;transform:rotate(45deg)}
.k-chip.ore i{background:var(--ore)}.k-chip.gas i{background:var(--gas);border-radius:50%}.k-chip.sup i{background:var(--ok);clip-path:polygon(50% 0,100% 100%,0 100%);transform:none}
.k-chip.full b{color:var(--bad)}
.k-clock{font:700 17px var(--num);color:var(--brass);font-variant-numeric:tabular-nums}
.k-tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.k-tools button{padding:4px 9px;font-size:13px}
.k-tools button.on{background:var(--brass);color:#16110a}
.k-touch{display:none}
@media (pointer:coarse){.k-touch{display:inline-block}}
.k-stage{position:relative;min-height:0;background:#0a0f18}
#k-view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.k-msgs{z-index:5;position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:min(90%,420px)}
.k-msg{background:rgba(16,21,31,.88);padding:4px 12px;border-left:3px solid var(--dim);font-size:14px}

.k-msg.market{border-color:var(--brass);color:#ffe6b0}
.k-tools button.k-ex-open{background:var(--brass);color:#16110a;font-weight:600}
.k-tools button.k-ex-open.on{background:var(--panel2);color:var(--brass)}
.k-ex{box-sizing:border-box;position:absolute;top:0;left:0;bottom:0;z-index:4;width:min(430px,100%);overflow:auto;background:rgba(16,21,31,.95);border-right:2px solid var(--brass);padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;display:flex;flex-direction:column;gap:8px}
.x-head{display:flex;align-items:center;gap:10px}.x-head h2{margin:0;font:400 22px var(--display);color:var(--brass)}.x-head span{font:700 14px var(--num);color:var(--dim)}.x-head button{margin-left:auto;padding:3px 9px}
.x-sum{display:flex;gap:16px;color:var(--dim)}.x-sum b{font:700 15px var(--num);color:var(--text)}
#x-rows{display:grid;gap:7px}
.x-row{display:grid;gap:4px;background:var(--panel);padding:7px 8px;border-left:3px solid var(--ore)}.x-row.gas{border-left-color:var(--gas)}
.x-top{display:grid;grid-template-columns:minmax(0,1fr) 90px 62px;gap:6px;align-items:center}
.k-game .x-name{all:unset;cursor:pointer;display:grid;min-width:0}.x-name b{font-size:15px}.x-name small{font-size:12px;color:var(--dim)}.k-game .x-name:focus-visible{outline:2px solid var(--brass)}
.x-top svg{width:90px;height:28px;display:block}
.x-price{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}.x-price b{display:block;font-size:17px}.x-price small{font-size:12px}.x-price .up{color:#ff8a7a}.x-price .dn{color:#7fbcff}
.x-stake{position:relative;height:7px;background:var(--panel2);display:flex;justify-content:space-between}.x-stake i{display:block;height:100%}.x-stake .me{background:#46c4ff}.x-stake .foe{background:#ff7350}.x-stake s{position:absolute;left:51%;top:-2px;bottom:-2px;width:2px;background:var(--text)}
.x-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}.x-pay.bad{color:#ff8a7a}
.x-btn{display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;gap:4px}.k-game .x-btn button{padding:4px 0;font-size:13px}.k-game .x-btn button:disabled{opacity:.38;cursor:default}
.x-war h3{margin:0 0 3px;font-size:12px;letter-spacing:.14em;color:var(--brass);font-weight:600}.x-war p{margin:3px 0 0;font-size:12.5px;color:var(--dim)}
.x-base{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--dim);background:var(--panel);padding:5px 8px;margin-bottom:3px;border-left:3px solid var(--line)}.x-base b{color:var(--text)}.x-base.hot{border-left-color:var(--bad)}.x-base .low{color:#ff9d90}
.x-news{font-size:13px;color:var(--dim)}.x-news p{margin:0;padding:2px 0}.x-news time{font-family:var(--num);color:var(--brass);margin-right:6px}
.d-help{margin:0;font-size:13px;line-height:1.5;color:var(--dim)}
#d-rows{display:grid;gap:7px}
.d-row{display:grid;gap:4px;background:var(--panel);padding:8px;border-left:3px solid var(--brass)}.d-row small{font-size:12.5px;color:var(--dim)}.d-row small.bad{color:#ff9d90}
.d-top{display:flex;justify-content:space-between;align-items:center}.d-state{font-style:normal;font-size:12.5px;color:var(--dim)}.d-state.ok{color:var(--ok)}.d-state.bad{color:var(--bad)}
.d-slide{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font:700 13px var(--num)}.d-slide input{width:100%;min-width:0;accent-color:var(--brass)}
.d-line{display:flex;gap:4px;align-items:center;justify-content:space-between;font-size:13px}.d-barter button{flex:1;padding:4px 2px;font-size:12.5px}
.k-game .d-apply{background:var(--brass);color:#16110a;font-weight:600;border:0;padding:6px}.k-game .d-apply:disabled{background:var(--panel2);color:var(--dim);cursor:default}
.k-set{z-index:14;background:rgba(8,12,22,.8);justify-content:center}
.s-panel{box-sizing:border-box;width:min(100%,680px);align-self:flex-start;background:var(--panel);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;min-height:100%}
.s-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-14px;background:var(--panel);padding-block:4px;z-index:1}.s-head h2{margin:0;font:400 28px var(--display);color:var(--brass)}
.s-note{margin:0;font-size:13px;line-height:1.5;color:var(--dim)}
.s-presets{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.s-presets span{font-size:13px;color:var(--dim)}
.s-panel section{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px}.s-panel h3{margin:0;font-size:12px;letter-spacing:.14em;color:var(--brass);font-weight:600}
.s-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,190px) 76px;gap:10px;align-items:center}.s-row label{display:grid;min-width:0;gap:1px}.s-row b{font-weight:600}.s-row small{font-size:12.5px;color:var(--dim)}.s-row.off{opacity:.55}
.s-row input[type=range]{width:100%;min-width:0;accent-color:var(--brass)}.s-row input[type=checkbox]{justify-self:start;width:20px;height:20px;accent-color:var(--brass)}.s-row output{text-align:right;font:700 14px var(--num);font-variant-numeric:tabular-nums}
.s-foot{padding-block:6px}
@media (max-width:520px){.s-row{grid-template-columns:minmax(0,1fr) 76px}.s-row label{grid-column:1/-1}}
.k-msg.warn{border-color:var(--bad);color:#ffd5cf}.k-msg.ok{border-color:var(--ok)}
.k-tribe{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));z-index:3;width:min(250px,46%);background:rgba(16,21,31,.9);border:1px solid #4f8a3c;border-left:3px solid #7bd65a;padding:6px 9px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.k-tribe[hidden]{display:none}.k-tribe .tr-top{display:flex;align-items:center;gap:8px}.k-tribe .tr-top b{color:#d9f7c6}.k-tribe .tr-top em{font-style:normal;font-size:12px;padding:0 6px;border:1px solid var(--line)}
.k-tribe .tr-ally{color:var(--ok);border-color:var(--ok)!important}.k-tribe .tr-hostile{color:var(--bad);border-color:var(--bad)!important}.k-tribe .tr-neutral{color:#e6f7c6}.k-tribe .tr-gone{color:var(--dim)}
.k-tribe button{margin-left:auto;padding:1px 7px;font-size:12px}.k-tribe .tr-pt{margin:2px 0 0}
.k-tribe .tr-m{border-top:1px solid var(--line);padding-top:4px}.k-tribe .tr-h{display:flex;justify-content:space-between;font-weight:600}.k-tribe .tr-m.ok .tr-h{color:var(--ok)}.k-tribe .tr-m.bad .tr-h{color:var(--bad)}
.k-tribe p{margin:1px 0 3px;color:var(--dim);font-size:12px;line-height:1.35}.k-tribe i{display:block;height:5px;background:#0a0f18}.k-tribe s{display:block;height:100%;background:#7bd65a;text-decoration:none}.k-tribe small{font:12px var(--num);color:var(--dim)}
.k-game.demo .k-tribe{display:none}
.k-obj{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));z-index:3;width:min(240px,42%);background:rgba(16,21,31,.88);border:1px solid #8a6d3c;border-right:3px solid #ffd36b;padding:6px 9px;font-size:13px;pointer-events:none}.k-obj[hidden]{display:none}
.k-obj b{color:#ffd36b;display:block;margin-bottom:3px}.k-obj p{margin:2px 0;color:#e8eef6;line-height:1.35}.k-obj p.ok{color:var(--ok)}.k-obj small{font:12px var(--num);color:var(--dim)}
.k-story{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;width:min(600px,92%);background:rgba(10,14,22,.94);border:1px solid #8a6d3c;border-left:4px solid #ffd36b;padding:9px 13px;font-size:15px;line-height:1.5;cursor:pointer}.k-story[hidden]{display:none}
.k-story b{display:block;color:#ffd36b;font-size:13px}.k-story span{color:#f2f5fa}.k-game.demo .k-obj,.k-game.demo .k-story{display:none}
.k-camp .c-list{display:flex;flex-direction:column;gap:6px}.k-camp .c-m{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:9px 12px;gap:2px}.k-camp .c-m b{font-size:16px;color:#ffd36b}.k-camp .c-m span{font-size:13px;color:var(--dim)}.k-camp .c-m.lock{opacity:.5}
.k-camp .c-brief p{margin:4px 0;line-height:1.6;font-size:15px}.k-camp .c-goals{margin:4px 0 8px 18px;padding:0;font-size:14px;line-height:1.6}.k-camp .c-code{margin-top:10px}.k-camp .c-code textarea{width:100%;font:12px var(--num);resize:none}
.k-tribe .tr-req{display:flex;flex-direction:column;align-items:flex-start;gap:1px;margin:0;width:100%;text-align:left;padding:5px 7px;font-size:13px;touch-action:manipulation}.k-tribe .tr-req b{color:#d9f7c6}.k-tribe .tr-req small{font:12px/1.35 inherit;color:var(--dim);white-space:normal}.k-tribe .tr-req.on{border-color:#7bd65a}
.k-tribe .tr-cur{border-top:1px solid var(--line);padding-top:4px}.k-tribe .tr-cur b{color:#ffd36b;margin-left:4px}.k-tribe .tr-renew{margin:3px 0 0;width:100%;padding:5px;font-size:13px;touch-action:manipulation}
.k-tribe .tr-q{cursor:pointer}.k-tribe .tr-q.sel{outline:2px solid #7bd65a;outline-offset:2px}.k-tribe .tr-ask{color:#e6f7c6;font-size:14px;line-height:1.45}.k-tribe .tr-ask b{font:700 17px var(--num);color:#ffd36b;white-space:nowrap}
.k-tribe .tr-ans{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:5px}.k-tribe .tr-ans output{font:700 20px var(--num);color:#ffd36b;min-width:4ch}.k-tribe .tr-ans span{font-size:12px;color:var(--dim)}
.k-tribe .tr-pad{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.k-tribe .tr-pad button{margin:0;padding:0;height:32px;font:600 15px var(--num);touch-action:manipulation}.k-tribe .tr-pad .go{grid-column:span 1;font-size:12px;background:#2f5a26;border-color:#7bd65a;color:#e9ffd9}
.k-mode{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:var(--brass);color:#16110a;font-weight:600;padding:4px 12px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.k-paused{position:absolute;inset:0;display:grid;place-items:center;font:400 44px var(--display);letter-spacing:.06em;background:rgba(8,12,22,.45);pointer-events:none}
.k-bottom{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;background:var(--panel);border-top:2px solid var(--brass);padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));min-height:176px}
.k-mapbox{width:160px;height:160px;background:#0a0f18;border:1px solid var(--line)}
#k-mini{width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.k-info{min-width:0;overflow:hidden;background:var(--ink);border:1px solid var(--line);padding:10px;clip-path:var(--cut)}
.k-empty{margin:0;color:var(--dim)}
.k-one{display:flex;gap:12px;align-items:flex-start}
.k-one img{width:76px;height:76px;background:var(--panel);border:1px solid var(--line)}
.k-one>div{min-width:0;flex:1}
.k-one h3{margin:0 0 2px;font:400 21px var(--display);letter-spacing:.02em}
.k-hp{margin:0;font:700 15px var(--num);color:var(--ok)}
.k-st{margin:2px 0 0;color:var(--dim)}
.k-prod{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.k-prod i{flex:1;min-width:70px;height:7px;background:var(--panel2);display:block}.k-prod s{display:block;height:100%;background:var(--brass)}
.k-many{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:3px;max-height:136px;overflow:auto}
.k-many button{padding:0;position:relative;aspect-ratio:1;background:var(--panel)!important;min-width:0}
.k-many img{width:100%;height:100%;display:block}.k-many i{position:absolute;left:0;bottom:0;height:3px}
.k-card{display:grid;grid-template-columns:repeat(4,58px);grid-auto-rows:50px;gap:4px;align-content:start;min-width:244px}
.k-cmd{position:relative;padding:0!important;display:grid;place-items:center;overflow:hidden;clip-path:var(--cut)}
.k-cmd img{width:42px;height:42px}
.k-cmd em{font-style:normal;font-weight:600;font-size:14px}
.k-cmd kbd{position:absolute;right:3px;top:1px;font:700 11px var(--num);color:var(--brass)}
.k-cmd u{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,12,22,.75);text-decoration:none;font:700 17px var(--num)}
.k-cmd.off{opacity:.42}.k-cmd.poor img,.k-cmd.poor em{opacity:.5}
.k-tip{position:absolute;z-index:6;max-width:250px;background:var(--ink);border:1px solid var(--brass);padding:8px 10px;pointer-events:none;font-size:13px}
.k-tip b{font-size:14px}.k-tip p{margin:3px 0 0;color:var(--dim)}.k-tip .why{color:#ffb3a8}
.k-tip{max-width:300px;line-height:1.45}.k-htip{max-width:320px;z-index:7}
.k-tip .t-kind{display:block;color:var(--brass);font-size:12px;margin-top:1px}
.k-tip table{border-collapse:collapse;margin-top:5px;width:100%}.k-tip th{text-align:left;font-weight:600;color:var(--dim);padding:1px 8px 1px 0;white-space:nowrap;vertical-align:top}.k-tip td{padding:1px 0;color:var(--text)}
.k-tip .c-ore{color:var(--ore)}.k-tip .c-gas{color:var(--gas)}.k-tip .ok{color:var(--ok)}.k-tip .no{color:#ffb3a8}
.k-tip .t-h{margin:6px 0 1px;color:var(--brass);font-size:12px}.k-tip ul{margin:0;padding:0;list-style:none}.k-tip li{padding:1px 0;color:var(--text)}.k-tip li.no{color:#c99}.k-tip li.done{color:var(--dim)}.k-tip li em{font-style:normal;color:#ffb3a8;font-size:12px}.k-tip li.done em{color:var(--ok)}
.k-tip kbd{display:inline-block;min-width:16px;text-align:center;font:700 11px var(--num);border:1px solid var(--line);padding:0 3px;margin-right:5px;color:var(--brass)}
.c-ore{color:var(--ore)}.c-gas{color:var(--gas)}
.k-overlay{position:absolute;inset:0;z-index:10;display:flex;overflow:auto}
/* 학습 미션 */
.k-rest{z-index:29;background:rgba(6,9,16,.95)}.k-rest .k-panel{max-width:560px;margin:auto;text-align:center;background:var(--ink);border:2px solid var(--brass);padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.k-rest .r-left{font:700 64px var(--num);color:var(--brass);margin:10px 0 6px;letter-spacing:.04em}.k-rest .k-go{justify-content:center}
.k-playbar{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:28;background:rgba(16,22,34,.95);border:1px solid var(--warn);color:var(--text);padding:6px 14px;font-size:15px;pointer-events:none;border-radius:4px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.k-learn{z-index:30;background:rgba(6,9,16,.9)}.k-learn .k-panel{max-width:640px;margin:auto;background:var(--ink);border:2px solid var(--brass);padding:18px 22px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.k-learn .l-sub{color:var(--brass);font-weight:600;margin:4px 0 6px}.k-learn .l-passage{background:var(--panel2);border-left:3px solid var(--brass);padding:10px 12px;line-height:1.7;font-size:17px;margin:6px 0}

<script>(globalThis.RTS = globalThis.RTS || {}).BUILD = 'cc7c628';
globalThis.RTS.VOICE_FILES = {};
// ─────────────────────────────────────────────────────────────
// core.js — 네임스페이스, 데이터 레지스트리, 모드 API, 난수, 게임 생성
// 규칙: engine/ 폴더는 DOM을 쓰지 않는다. Node에서도 그대로 돌아간다.
// 좌표 단위는 타일(float). 시뮬레이션은 20틱/초 고정이며 결정적이다.
// ─────────────────────────────────────────────────────────────
const RTS = (globalThis.RTS = globalThis.RTS || {});
RTS.version = '0.1.0';
RTS.HZ = 20;
RTS.defs = { terrain: {}, entities: {}, upgrades: {}, abilities: {}, factions: {}, maps: {}, mapgens: {}, difficulties: {}, companies: {}, marketEvents: {}, branches: {}, tribeMissions: {}, merges: {} };
RTS.TRIBE = -2;       // 잿빛 부족(AI 중립 세력)의 팀 번호. -1은 자원·거점 같은 비활성 중립
RTS.orders = {};      // 유닛 명령 핸들러: RTS.orders.move = (G,u,o)=>...

RTS.commands = {};    // 플레이어 입력 처리기: RTS.commands.train = (G,team,cmd)=>...

// 콘텐츠 추가는 전부 이 함수 하나로 한다. 같은 id는 덮어쓴다.
RTS.mod = function (pack) {

// 기존 정의 일부만 수정: RTS.patch('entities','p_rifle',{hp:60})
RTS.patch = (kind, id, change) => Object.assign(RTS.defs[kind][id], change);
// 시스템 삽입: RTS.addSystem({id:'weather',run}, {before:'movement'})
RTS.addSystem = function (sys, pos = {}) {
  const ref = pos.before || pos.after;
  const i = ref ? RTS.systems.findIndex(s => s.id === ref) : -1;
  if (i < 0) RTS.systems.push(sys); else RTS.systems.splice(pos.before ? i : i + 1, 0, sys);

RTS.rand = G => { // mulberry32. 상태가 G.rng에 있어 저장/리플레이가 재현된다.
  G.rng = (G.rng + 0x6D2B79F5) | 0;
  let t = G.rng; t = Math.imul(t ^ (t >>> 15), t | 1);

RTS.on = (G, type, fn) => { (G._ls[type] = G._ls[type] || []).push(fn); };
RTS.emit = (G, type, data) => { (G._ls[type] || []).forEach(f => f(data, G)); };

// 설정값. 옛 저장 파일에 없는 항목은 기본값으로 채운다.
RTS.cfg = G => G.cfg || (G.cfg = RTS.defaultSettings());
RTS.createGame = function (opts) {
  // opts: {map, seed, players:[{faction, ai:null|'easy'|'normal'|'hard', name}]}
  const G = { tick: 0, rng: (opts.seed || 1) | 0, nextId: 1, ents: [], byId: {}, teams: [], cmds: [], projectiles: [],
    over: null, mapId: opts.map, seed: opts.seed || 1, cfg: Object.assign(RTS.defaultSettings(), opts.settings), _ls: {} };
  const easy = opts.camp ? null : opts.players.map(p => p.ai && RTS.defs.difficulties[p.ai]).find(d => d && d.reveal); // 캠페인은 왕초보의 맵 공개·방어탑을 쓰지 않는다
  G.coop = !!opts.coop; // 둘이 협동: 사람 둘(편 0)이 동맹해 중립세력 AI(편 1)와 싸운다
  G.nofog = !!opts.nofog || !G.cfg.fog || !!easy;
  const spec = RTS.defs.maps[opts.map];
  const m = RTS.defs.mapgens[spec.gen](spec, G);
  G.w = m.w; G.h = m.h; G.tiles = m.tiles; G.bases = m.bases; G.siteSpots = m.sites || []; G.postSpots = m.posts || []; G.tribeSpot = m.tribe || null; G.tribeFixed = !!m.tribeFixed; if (m.elev) G.elev = m.elev;
  RTS.initRuntime(G);
  opts.players.forEach((p, i) => {
    const size = G.w * G.h;
    const t = { id: i, faction: p.faction, ai: p.ai || null, name: p.name || RTS.defs.factions[p.faction].name,
      res: { ore: G.cfg.startOre, gas: G.cfg.startGas }, sup: 0, cap: 0, have: {}, upgrades: {}, research: {}, inc: 1, mods: {}, aiState: {},
      stats: { kills: 0, lost: 0, ore: 0, gas: 0, made: 0 }, vis: new Array(size).fill(0), seen: new Array(size).fill(0) };
    if (p.side !== undefined) t.side = p.side; // 같은 편끼리는 동맹(RTS.ally)
    if (p.npc) t.npc = true; // 캠페인 수비대: AI 없이 제자리를 지키는 팀(시야 계산·조작 없음)
    if (p.noBase) t.noBase = true; // 캠페인: 본진 없이 부대만으로 시작
    if (p.ai) { t.boost = p.boost || 1; t.inc = RTS.defs.difficulties[p.ai].income * t.boost; } // boost: 중립세력 AI 성능 배율
    const hc = p.hc && RTS.HANDICAPS && RTS.HANDICAPS[p.hc]; // 2인 대전 팀별 핸디캡
    if (hc && hc.id !== 'none') { t.hc = hc.id; t.res.ore += hc.ore || 0; t.res.gas += hc.gas || 0; t.inc *= hc.income || 1; if (hc.reveal) t.reveal = true; }
    G.teams.push(t);
  });
  m.nodes.forEach(n => {
    const e = RTS.spawn(G, n.def, -1, n.tx + RTS.defs.entities[n.def].size[0] / 2, n.ty + RTS.defs.entities[n.def].size[1] / 2);
    e.amount = RTS.defs.entities[n.def].amount;
  });
  if (opts.camp) { if (opts.starts) { for (const b of G.bases) delete b.start; opts.starts.forEach((k, i) => { if (k !== null && k !== undefined && G.bases[k]) G.bases[k].start = i; }); } } // 캠페인: 미션이 팀마다 기지를 정한다
  else RTS.pickStarts(G, spec, G.coop ? 2 : G.teams.length);
  const starts = G.bases.filter(b => b.start !== undefined), spots = opts.camp ? null : G.coop ? RTS.coopBases(G) : G.teams.length > 2 ? RTS.ffaBases(G) : null;
  G.teams.forEach((t, i) => {
    const b = spots ? spots[i] : starts.find(s => s.start === i), f = RTS.defs.factions[t.faction];
    if (!b || t.npc || t.noBase) return;
    b.owner = i;
    const hs = RTS.defs.entities[f.hq].size, hq = RTS.spawn(G, f.hq, i, Math.round(b.x - hs[0] / 2) + hs[0] / 2, Math.round(b.y - hs[1] / 2) + hs[1] / 2); hq.built = hq.buildT; hq.hp = RTS.stat(G, hq, 'hp');
    const ore = RTS.nearestNode(G, b.x, b.y, 'ore', 30);
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * Math.PI * 2;
      const w = RTS.spawn(G, f.worker, i, b.x + Math.cos(a) * 3, b.y + Math.sin(a) * 3);

  G.teams.forEach(t => { const hc = t.hc && RTS.HANDICAPS[t.hc]; if (hc && hc.towers) RTS.giveTowers(G, t, hc.towers); });
  const campM = opts.camp && RTS.campDef && RTS.campDef(opts.camp.id);

// 시작 위치 고르기: 후보(spawn) 중에서 n곳을 무작위로 고른다. 고른 곳끼리는 spawnGap(기본: 맵 긴 변 × 0.38) 이상 떨어져야 한다.
// 고른 기지에 start 0,1,(2)를 붙이고 나머지 후보는 확장 기지가 된다. 셋이 싸울 때 세 곳을 못 고르면 두 곳만 고르고 셋째는 ffaBases가 정한다.
// 설정 randomStart를 끄거나 후보가 모자라면 맵 기본 자리(start 0과 맞은편)를 쓴다.
RTS.pickStarts = function (G, spec, n) {
  const sp = G.bases.filter(b => b.spawn), d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y), gap = spec.spawnGap || Math.max(G.w, G.h) * .38;
  if (!RTS.cfg(G).randomStart || sp.length < 3) return;
  const sets = [], k = Math.min(n, 3);
  const walk = (from, cur) => { if (cur.length === k) { sets.push(cur.slice()); return; } for (let i = from; i < sp.length; i++) if (cur.every(c => d(c, sp[i]) >= gap)) { cur.push(sp[i]); walk(i + 1, cur); cur.pop(); } };
  walk(0, []); if (!sets.length && k === 3) { sets.length = 0; const k2 = 2; const w2 = (from, cur) => { if (cur.length === k2) { sets.push(cur.slice()); return; } for (let i = from; i < sp.length; i++) if (cur.every(c => d(c, sp[i]) >= gap)) { cur.push(sp[i]); w2(i + 1, cur); cur.pop(); } }; w2(0, []); }
  if (!sets.length) return;

// 협동 시작 위치: 0번 사람 = 시작 기지 0, 중립세력(2번) = 맞은편 시작 기지 1,

// 같은 편이면 동맹. 편(side)이 없는 일반 게임에서는 자기 팀만 해당한다.

// 왕초보: 본진 둘레에 완공된 방어탑을 [최소,최대] 사이 무작위 개수만큼 세운다.

RTS.initRuntime = function (G) {

RTS.step = function (G) {

// 저장은 '_' 로 시작하지 않는 모든 필드를 JSON으로 직렬화한다.
RTS.serialize = G => JSON.stringify(G, (k, v) => (k[0] === '_' ? undefined : v));

// map.js — 타일, 점유, 경로탐색(A*), 시야선, 공간 해시, 시야(안개), 기본 맵 생성기

RTS.UPHILL = .75; // 낮은 곳에서 높은 곳의 지상 대상을 쏘면 피해 ×0.75

// 가장 가까운 통행 가능 타일 (나선 탐색)

RTS.visibleTo = (G, teamId, x, y) => { const t = G.teams[teamId]; return G.nofog || !t || !!t.vis[(y | 0) * G.w + (x | 0)]; };

// 기본 맵 생성기: 데이터(암벽 원/선, 기지 위치)만 받아 180도 회전 대칭으로 찍는다.

// 철거: 일꾼 누구나. 완공된 내 건물, 생산·연구·강화 대기열이 비어 있을 때. 비용은 철거를 시작할 때 한 번 낸다(되돌려 받지 않는다)

// 주가: 평균회귀 + 무작위 변동 + 매매 충격. 배당: 30초마다 실적에 비례. 51주 이상이면 경영권.

function news(G, text) { const m = G.market; m.news.unshift({ t: G.tick, text }); m.news.length = Math.min(m.news.length, 6); tell(G, text, 'market'); }
function syncControl(G, c) {
  let owner = -1; c.shares.forEach((n, i) => { if (n >= RTS.cfg(G).control) owner = i; });
  if (owner === c.owner) return;
  c.owner = owner; const e = G.byId[c.site], d = RTS.defs.companies[c.id];
  if (e) { e.team = owner; e.hitAt = 0; }

// 체결가를 미리 계산한다. UI 표시와 실제 체결이 같은 식을 쓴다.

RTS.commands.trade = function (G, team, cmd) {

RTS.siteHit = function (G, e, dmg, src) {

  e.hp = 1; e.downUntil = G.tick + RTS.cfg(G).siteDown * RTS.HZ; c.earn *= .75;
  news(G, RTS.defs.companies[c.id].name + ' 거점 피습, 가동 중단'); RTS.emit(G, 'siteDown', { e });

// 본진 함락: 패전 진영의 사령부가 모두 사라지면 시장 전체에 충격이 온다. 수치는 설정의 '전쟁과 시장'.
RTS.warFall = function (G, team) {
  const C = RTS.cfg(G), t = G.teams[team], cos = Object.values(G.market.cos); let cash = 0, sold = 0;
  for (const c of cos) { c.price = Math.max(1, c.price * (1 - C.warCrash / 100)); const n = Math.floor(c.shares[team] * C.warSell / 100);
    if (n) { cash += n * c.price * (1 - C.warHaircut / 100); sold += n; c.shares[team] -= n; c.free += n; syncControl(G, c); }
    if (RTS.defs.companies[c.id].resource === 'ore') c.earn = Math.min(2.5, c.earn * (1 + C.warRebuild / 100)); }
  t.res.ore += cash;
  if (C.warAlly && G.dip) for (const b of Object.values(G.dip.list)) if (b.ally === team) RTS.branchDown(G, G.byId[b.site]);

RTS.systems.splice(RTS.systems.findIndex(s => s.id === 'cleanup'), 0, { id: 'market', run(G) {
  if (!G.market) RTS.initMarket(G);
  const m = G.market, C = RTS.cfg(G);
  if (G.tick % RTS.HZ) return;
  for (const c of Object.values(m.cos)) {
    const d = RTS.defs.companies[c.id], e = G.byId[c.site];
    const g = (RTS.rand(G) + RTS.rand(G) + RTS.rand(G) - 1.5) * 1.15; // 근사 정규분포
    const fair = RTS.fair(c) * (e && e.downUntil > G.tick ? .6 : 1);
    c.price = Math.max(1, c.price + (fair - c.price) * .02 + c.price * d.vol * g * C.volatility / 100);
    c.earn += (1 - c.earn) * .004;
    if (G.tick % (RTS.HZ * 5) === 0) { c.hist.push(+c.price.toFixed(2)); if (c.hist.length > 72) c.hist.shift(); }
    if (e) { const was = e.downUntil; const hp = RTS.defs.entities[e.def].hp;

    for (const c of Object.values(m.cos)) { const d = RTS.defs.companies[c.id], e = G.byId[c.site]; if (e && e.downUntil > G.tick) continue;
      c.shares.forEach((n, i) => { if (!n) return; const k = c.owner < 0 ? 1 : c.owner === i ? C.ctrlBonus / 100 : C.minority / 100, t = G.teams[i], pay = n * RTS.dividend(G, c) * k * (1 + RTS.allyPerk(G, i, 'divBonus')) * (t.credit ?? 1);

  if (C.newsEvery > 0 && G.tick >= m.nextEvent) { m.nextEvent = G.tick + Math.round(C.newsEvery * (.67 + RTS.rand(G) * .66) * RTS.HZ); const pow = C.newsImpact / 100;

    for (const c of Object.values(m.cos)) { const d = RTS.defs.companies[c.id]; if (ev.scope === 'all' || ev.scope === d.resource || ev.scope === c.id) { c.earn = Math.max(.3, Math.min(2.5, c.earn * (1 + (ev.earn - 1) * pow))); c.price = Math.max(1, c.price * Math.max(.1, 1 + (ev.price - 1) * pow)); } }
    news(G, ev.text); }

// AI 투자: 저평가 종목을 사고, 과열되면 팔고, 과반이 가까우면 인수까지 밀어붙인다.
RTS.aiInvest = function (G, t, diff, ready) {
  const cos = Object.values(G.market.cos), cmd = c => RTS.command(G, t.id, c);
  for (const c of cos) if (c.shares[t.id] && c.owner !== t.id && c.price > RTS.fair(c) * 1.3) { cmd({ type: 'trade', company: c.id, qty: -5 }); return; }
  const S = t.aiState; if (!ready || t.res.ore < diff.invest || G.tick < (S.nextInvest || 120 * RTS.HZ)) return;

  const score = c => RTS.dividend(G, c) / c.price * (RTS.defs.companies[c.id].resource === 'gas' ? 1.5 : 1) + (foe(c) ? .05 : 0); // 에테르 배당은 광석보다 비싸게 친다

  const pick = chase || cos.filter(c => c.free > 0 && c.owner < 0 && c.price < RTS.fair(c) * 1.1).sort((a, b) => score(b) - score(a))[0];
  if (pick) cmd({ type: 'trade', company: pick.id, qty: 5 });
};

// war.js — 기지 전투의 경제 효과. 사령부 반경 안의 건물과 일꾼이 맞으면 피해액을 계산한다.

    G.war.supply.ore += loss * Math.min(1, b.res / RTS.WAR.richFull); if (b.gas) G.war.supply.gas += loss * .5; }

RTS.systems.splice(RTS.systems.findIndex(s => s.id === 'market'), 0, { id: 'war', run(G) {
  if (!G.war) RTS.initWar(G); if (G.tick % RTS.HZ) return;
  const W = G.war, C = RTS.cfg(G), D = RTS.defs.entities, hqs = G.ents.filter(e => !e.dead && e.team >= 0 && D[e.def].dropoff && RTS.complete(e)), next = {}; W.total = {};

  for (const h of hqs) { const o = W.bases[h.id] || { eff: 1, lost: 0, lastHit: -9999 }; o.team = h.team; o.main = mainId[h.team] === h.id; o.value = 0; o.res = 0; o.gas = 0; o.n = 0; next[h.id] = o; }
  for (const e of G.ents) { if (e.dead) continue; const d = D[e.def]; if (d.kind === 'unit' && !d.gather) continue; if (d.site) continue;
    let best = null, bd = RTS.WAR.radius; for (const h of hqs) { if (e.team >= 0 && h.team !== e.team) continue; const q = Math.hypot(h.x - e.x, h.y - e.y); if (q < bd) { bd = q; best = h; } } if (!best) continue;
    const o = next[best.id]; if (d.resource) { o.res += e.amount || 0; continue; } o.value += d.gather ? RTS.WAR.workerValue : costValue(d); if (d.kind === 'building') o.n++; if (d.placeOn) o.gas = 1; }

    const drop = Math.min(.05, L / 8000 * C.warMarket / 100); for (const c of cos) c.price = Math.max(1, c.price * (1 - drop));

// diplomacy.js — 중립 진영 자유상단. 지부 위치는 게임마다 섞이고, 정찰로 찾아야 거래할 수 있다.
// 동맹 신청은 베팅이다: 동맹금을 걸고 확률 판정을 받으며, 거절되면 동맹금을 잃는다.
RTS.DIP = { min: 100, full: 600, firstBonus: .15, firstOre: 100, failTrust: .05, cooldown: 45, cap: .9, stakeYield: .06, downSec: 60, spread: .2, allySpread: .1, lot: 50 };
RTS.initDip = function (G) {
  const m = G.dip = { list: {}, rate: 2 }, ids = Object.keys(RTS.defs.branches), spots = (G.postSpots || []).slice();
  for (let i = spots.length - 1; i > 0; i--) { const j = Math.floor(RTS.rand(G) * (i + 1)); [spots[i], spots[j]] = [spots[j], spots[i]]; }
  ids.forEach((id, i) => { const s = spots[i]; if (!s) return;
    let tx = Math.round(s.x - 1.5), ty = Math.round(s.y - 1.5), ok = false;
    for (let r = 0; r < 10 && !ok; r++) for (let dy = -r; dy <= r && !ok; dy++) for (let dx = -r; dx <= r && !ok; dx++) if (RTS.canPlace(G, -1, 'n_post', tx + dx, ty + dy, 1)) { tx += dx; ty += dy; ok = true; }
    const e = RTS.spawn(G, 'n_post', -1, tx + 1.5, ty + 1.5); e.built = e.buildT; e.hp = RTS.defOf(e).hp; e.branch = id;
    m.list[id] = { id, site: e.id, ally: -1, stake: 0, finder: -1, found: G.teams.map(() => false), trust: G.teams.map(() => 0), wait: G.teams.map(() => 0), lockUntil: 0, nextCaravan: 0 }; });
};
RTS.branchKnown = (G, team, e) => team < 0 || G.nofog || !e.branch || (G.dip.list[e.branch].found[team]);
RTS.tradeSpread = function (G, team) { const D = RTS.DIP, L = Object.values(G.dip.list).filter(b => b.ally === team); if (!L.length) return D.spread; return Math.min(...L.map(b => RTS.defs.branches[b.id].perk.spread ?? D.allySpread)); };
RTS.allyPerk = function (G, team, key) { let v = 0; for (const b of Object.values((G.dip || { list: {} }).list)) if (b.ally === team) v += RTS.defs.branches[b.id].perk[key] || 0; return v; };
RTS.allyChance = function (G, team, id, stake) { const D = RTS.DIP, b = G.dip.list[id], d = RTS.defs.branches[id], k = Math.max(0, Math.min(1, (stake - D.min) / (D.full - D.min)));
  return Math.min(D.cap, d.base + k * .5 + (b.finder === team ? RTS.cfg(G).firstBonus / 100 : 0) + b.trust[team]); };
RTS.allyBlock = function (G, team, id, stake) { const D = RTS.DIP, b = G.dip.list[id], d = RTS.defs.branches[id], t = G.teams[team];
  if (!b.found[team]) return '아직 찾지 못한 지부입니다';
  if (b.ally === team) return '이미 동맹입니다';
  if (b.ally >= 0) return '상대가 먼저 동맹을 맺었습니다';
  if (b.lockUntil > G.tick) return '지부 복구 중입니다';
  if (b.wait[team] > G.tick) return '재신청 대기 ' + Math.ceil((b.wait[team] - G.tick) / RTS.HZ) + '초';
  if (!d.check(G, t)) return '조건 미달: ' + d.need;
  if (stake < D.min) return '동맹금은 최소 ' + D.min + '입니다';
  if (t.res.ore < stake) return '광석이 부족합니다';
  return null; };
const dipTell = (G, team, text, kind) => RTS.emit(G, 'notice', { team, text, kind });
RTS.commands.ally = function (G, team, c) {
  const block = RTS.allyBlock(G, team, c.branch, c.stake); if (block) { dipTell(G, team, block, 'warn'); return; }
  const D = RTS.DIP, b = G.dip.list[c.branch], d = RTS.defs.branches[c.branch], t = G.teams[team], ok = RTS.rand(G) < RTS.allyChance(G, team, c.branch, c.stake);
  const loss = ok ? c.stake : Math.round(c.stake * RTS.cfg(G).rejectLoss / 100); t.res.ore -= loss; b.wait[team] = G.tick + D.cooldown * RTS.HZ;
  if (!ok) { b.trust[team] = Math.min(.25, b.trust[team] + D.failTrust); t.stats.burned = (t.stats.burned || 0) + loss; dipTell(G, team, `${d.name}가 거절했습니다. 동맹금 ${loss} 손실`, 'warn'); RTS.emit(G, 'allyResult', { team, id: b.id, ok }); return; }
  b.ally = team; b.stake = c.stake; b.nextCaravan = G.tick + 20 * RTS.HZ; const e = G.byId[b.site]; e.team = team;
  for (const o of G.teams) dipTell(G, o.id, o.id === team ? `${d.name}와 동맹 성립` : `${t.name}, ${d.name}와 동맹`, o.id === team ? 'ok' : 'market');
  for (let i = 0; i < (d.perk.mercs || 0); i++) { const p = RTS.nearestFree(G, e.x, e.y + 3); RTS.spawn(G, 'n_merc', team, p.x + (i % 3) * .3, p.y + i * .15); }
  RTS.emit(G, 'allyResult', { team, id: b.id, ok });

RTS.commands.fund = function (G, team, c) { const b = G.dip.list[c.branch], t = G.teams[team]; if (!b || b.ally !== team) return; if (t.res.ore < c.amount) { dipTell(G, team, '광석이 부족합니다', 'warn'); return; } t.res.ore -= c.amount; b.stake += c.amount; };
RTS.commands.barter = function (G, team, c) { // buy: 광석→에테르, 아니면 에테르→광석
  const D = RTS.DIP, t = G.teams[team], b = G.dip.list[c.branch]; if (!b || !b.found[team] || (b.ally >= 0 && b.ally !== team) || b.lockUntil > G.tick) { dipTell(G, team, '이 지부와는 거래할 수 없습니다', 'warn'); return; }

  else { if (t.res.gas < D.lot) { dipTell(G, team, '에테르가 부족합니다', 'warn'); return; } t.res.gas -= D.lot; t.res.ore += Math.floor(D.lot * rate * (1 - s)); }

RTS.branchDown = function (G, e) { const b = G.dip.list[e.branch], d = RTS.defs.branches[e.branch], was = b.ally;
  if (was >= 0) { for (const o of G.teams) dipTell(G, o.id, `${d.name} 지부 파괴, ${G.teams[was].name}의 동맹 해제`, 'market'); }

  T.req[team] = req; T.pick[team] = false; tTell(G, team, `${TR().name}에 '${RTS.TRIBE_REQS[req].name}'을(를) 요청했습니다`, 'ok'); RTS.emit(G, 'tribeReq', { team, req }); return true; };
RTS.commands.tribeReq = (G, team, c) => { RTS.tribeChoose(G, team, c.req); };
// 미션 진행도 [현재, 목표]. 수학 미션은 [성공 1/0, 1]
RTS.missionProg = (G, team, m) => { const d = RTS.defs.tribeMissions[m.id]; if (d.quiz) return [m.done === true ? 1 : 0, 1]; return [Math.max(0, Math.min(d.need, d.prog(G, G.teams[team], m))), d.need]; };
// 학습 문제 수준 1~3(설정 mathLevel)
// 문제 난이도 단계 -1~1: 수준(학년)은 그대로 두고 그 안에서 수를 크게(작게) 고른다. 캠페인은 미션 진행·난이도(RTS.learnStep),
// 그 밖에는 상대 AI 난이도 + 게임 시간(분당 perMin, 최대 maxTime). 시드 난수만 쓰므로 두 기기에서 같다
RTS.TRIBE_QUIZ_STEP = { ai: { beginner: -.5, easy: -.25, normal: 0, hard: .3 }, perMin: .02, maxTime: .4 };
RTS.tribeQuizStep = function (G, team) { const Q = RTS.TRIBE_QUIZ_STEP, cl = v => Math.max(-1, Math.min(1, v));
  if (G.camp && RTS.learnStep && RTS.campDef) return cl(RTS.learnStep(RTS.campDef(G.camp.id), G.camp.level));
  const ais = G.teams.filter(t => t.ai && t.id !== team && Q.ai[t.ai] !== undefined && (!RTS.ally || !RTS.ally(G, team, t.id))).map(t => Q.ai[t.ai] + ((t.boost || 1) - 1));
  return cl((ais.length ? Math.max(...ais) : 0) + Math.min(Q.maxTime, G.tick / RTS.HZ / 60 * Q.perMin)); };
const quizRi = (G, st) => (a, b) => { let u = RTS.rand(G); const k = st * .5; u = k >= 0 ? k + u * (1 - k) : u * (1 + k); return a + Math.min(b - a, Math.floor(u * (b - a + 1))); };
RTS.mathLevel = G => Math.max(1, Math.min(3, Math.round(RTS.cfg(G).mathLevel || 1)));
// 수학 미션 답 보내기: 답과 같으면 그만큼 광석을 내고 성공. 틀리면 광석은 그대로, 많다/적다 힌트. quizTries번 틀리면 실패
RTS.tribeAnswer = function (G, team, idx, value) { const T = G.tribe, t = G.teams[team]; if (!T || !t) return false;
  const L = T.missions[team], m = L && L[idx], d = m && RTS.defs.tribeMissions[m.id]; if (!m || !d || !d.quiz || m.done !== null) return false;
  const v = Math.floor(+value); if (!(v >= 0 && v <= TR().quizMax)) { tTell(G, team, '보낼 광석 수를 숫자로 넣으세요', 'warn'); return false; }
  if (v > t.res.ore) { tTell(G, team, `가진 광석(${Math.floor(t.res.ore)})보다 많이 보낼 수 없습니다. 광석을 더 모으세요`, 'warn'); return false; }
  if (v === m.ans) { t.res.ore -= v; m.done = true; tTell(G, team, `정답! ${m.q} = ${m.ans}. 광석 ${v}만큼 바쳤습니다`, 'ok'); RTS.emit(G, 'tribeAnswer', { team, ok: true }); return true; }
  m.tries++; const left = TR().quizTries - m.tries;
  if (left <= 0) { m.done = false; tTell(G, team, `외교 미션 실패: ${d.name}. ${m.q}의 답은 ${m.ans}입니다`, 'warn'); }
  else tTell(G, team, `틀렸습니다. 답은 ${v}보다 ${v < m.ans ? '큽니다' : '작습니다'} (남은 기회 ${left}번)`, 'warn');
  RTS.emit(G, 'tribeAnswer', { team, ok: false }); return false; };
RTS.commands.tribeAnswer = (G, team, c) => { RTS.tribeAnswer(G, team, c.mission | 0, c.value); };

// 공병이 회당까지 걸어가서 외교를 신청하고, 끝나면 일터로 돌아간다
// 부족 수송차: 동맹 본진(가장 가까운 자원 반납 건물)으로 가서 화물을 내려놓는다
RTS.orders.tribeCart = function (G, u, o) { const drop = RTS.nearestDrop(G, u); if (!drop) { RTS.kill(G, u, null, true); return; }
  if (RTS.edgeDist(u, drop) < .8) { const t = G.teams[u.team], T = G.tribe; t.res.ore += o.ore; t.res.gas += o.gas; if (T) { reqInit(T); T.got[u.team].ore += o.ore; T.got[u.team].gas += o.gas; }
    tTell(G, u.team, `${TR().name} 수송차 도착: 광석 +${o.ore} · 에테르 +${o.gas}`, 'ok'); RTS.emit(G, 'tribeShare', { team: u.team, ore: o.ore, gas: o.gas }); u.cartDone = true; RTS.kill(G, u, null, true); return; }
  RTS.goTo(G, u, drop); };
RTS.orders.envoy = function (G, u, o) { const h = G.byId[o.target];
  if (!h || h.dead || h.team !== RTS.TRIBE) { RTS.issue(G, u, null); return; }
  RTS.goTo(G, u, h); if (RTS.edgeDist(u, h) > .9) return;
  RTS.tribeRequest(G, u.team); const drop = RTS.nearestDrop(G, u), n = drop && RTS.nearestNode(G, drop.x, drop.y, 'ore', 16);
  RTS.issue(G, u, n ? { type: 'gather', node: n.id } : null); };

// 부족 건물·병력이 맞았을 때. 중립·동맹인 플레이어가 직접 공격하면 적대가 된다
RTS.tribeHit = function (G, e, src) { const T = G.tribe; if (!T || !src || src.team < 0) return; const p = src.team;
  if (T.rel[p] === 'hostile' || T.war[p] > G.tick) return;
  const was = T.rel[p]; T.rel[p] = 'hostile'; T.missions[p] = null; reqInit(T); T.req[p] = null; T.pick[p] = false; T.nextRaid[p] = G.tick + TR().raidFirst * RTS.HZ;
  for (const o of G.teams) tTell(G, o.id, o.id === p ? `${TR().name}${was === 'ally' ? '이 배신에 분노합니다' : '을 공격했습니다'}. 이제 적대 관계입니다` : `${G.teams[p].name}이(가) ${TR().name}과 적대 관계가 되었습니다`, o.id === p ? 'warn' : 'market');
  RTS.emit(G, 'tribeRel', { team: p, rel: 'hostile' }); };
// 원군 보내기: 회당 경비를 남기고 가까운 병력부터 최대 helpMax기. foeTeam과 helpWar초 동안 서로 적이 된다
function tribeSend(G, p, foeTeam, x, y) { const T = G.tribe, R = TR(), h = G.byId[T.hall]; if (!h) return 0;
  const go = tribeUnits(G).sort((a, b) => Math.hypot(a.x - h.x, a.y - h.y) - Math.hypot(b.x - h.x, b.y - h.y)).slice(R.guards).slice(0, R.helpMax); if (!go.length) return 0;
  T.war[foeTeam] = Math.max(T.war[foeTeam], G.tick + R.helpWar * RTS.HZ); T.sent++;
  for (const u of go) RTS.issue(G, u, { type: 'amove', x, y, help: 1 }); return go.length; }
// 기지방어 요청: 내 건물이 공격받으면 확률로 방어 병력을 보내고, 확률로 내 방어탑을 지어 준다
RTS.tribeAllyHit = function (G, e, src) { const T = G.tribe, p = e.team, R = TR();
  if (!T || T.dead || !src || src.team < 0 || src.team === p || !RTS.foe(G, p, src.team) || RTS.tribeReqOf(G, p) !== 'defend' || RTS.defOf(e).kind !== 'building' || G.tick < T.helpNext) return;
  T.helpNext = G.tick + R.helpEvery * RTS.HZ; let said = false;
  if (T.towers[p] < R.towerMax && RTS.rand(G) < R.towerChance && tribeTower(G, p, e)) { T.towers[p]++; said = true; tTell(G, p, `${R.name}이 방어탑을 지어 주었습니다 (${T.towers[p]}/${R.towerMax})`, 'ok'); }
  if (RTS.rand(G) < R.helpChance) { const n = tribeSend(G, p, src.team, e.x, e.y); if (n) { said = true; tTell(G, p, `${R.name}이 방어 병력 ${n}기를 보냈습니다`, 'ok'); tTell(G, src.team, `${R.name}이 상대 기지를 지키고 있습니다`, 'warn'); RTS.emit(G, 'tribeHelp', { team: p, n }); } }
  if (!said) tTell(G, p, `${R.name}은(는) 이번에는 돕지 않았습니다`, 'market'); };
function tribeTower(G, p, near) { const t = G.teams[p], f = RTS.defs.factions[t.faction], id = f && f.defense; if (!id) return false; const d = RTS.defs.entities[id];
  for (let r = 3; r <= 9; r++) for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2 + r, tx = Math.round(near.x + Math.cos(a) * r - d.size[0] / 2), ty = Math.round(near.y + Math.sin(a) * r - d.size[1] / 2);
    if (!RTS.canPlace(G, p, id, tx, ty, 1)) continue; const b = RTS.spawn(G, id, p, tx + d.size[0] / 2, ty + d.size[1] / 2); b.built = b.buildT; b.hp = d.hp; RTS.census(G); return true; }
  return false; }
// 협공 요청: 내가 적을 공격하면 확률로 원군을 보내 함께 공격한다
RTS.tribeAllyStrike = function (G, e, src) { const T = G.tribe, p = src && src.team, R = TR();
  if (!T || T.dead || p === undefined || p < 0 || e.team < 0 || e.team === p || !RTS.foe(G, p, e.team) || RTS.tribeReqOf(G, p) !== 'strike' || G.tick < T.strikeNext) return;
  T.strikeNext = G.tick + R.strikeEvery * RTS.HZ;
  if (RTS.rand(G) >= R.strikeChance) { tTell(G, p, `${R.name}은(는) 이번에는 협공하지 않았습니다`, 'market'); return; }
  const n = tribeSend(G, p, e.team, e.x, e.y); if (!n) return;
  tTell(G, p, `${R.name}이 원군 ${n}기를 보내 함께 공격합니다`, 'ok'); tTell(G, e.team, `${R.name}이 상대와 함께 공격해 옵니다`, 'warn'); RTS.emit(G, 'tribeHelp', { team: p, n, strike: 1 }); };
RTS.tribeDeath = function (G, e, src) { const T = G.tribe;
  if (e.def === 't_cart' && !e.cartDone && e.order) { tTell(G, e.team, `${TR().name} 수송차가 파괴되었습니다. 광석 ${e.order.ore} · 에테르 ${e.order.gas}을 잃었습니다`, 'warn'); if (T) T.lost = (T.lost || 0) + 1; return; }
  if (!T || !e.tribeHall) return; T.dead = true;
  const k = src && src.team >= 0 ? src.team : -1; if (k >= 0) { G.teams[k].res.ore += TR().loot; G.teams[k].stats.loot = (G.teams[k].stats.loot || 0) + TR().loot; }
  for (const o of G.teams) tTell(G, o.id, `${TR().name} 회당이 무너졌습니다` + (o.id === k ? `. 광석 +${TR().loot}` : ''), o.id === k ? 'ok' : 'market');
  T.missions = T.missions.map(() => null); };

function tribeSettle(G, team) { const T = reqInit(G.tribe), L = T.missions[team], ok = L.filter(m => m.done).length; T.missions[team] = null;
  const name = TR().name, other = T.rel.some((x, i) => i !== team && x === 'ally');
  if (T.rel[team] === 'ally') { // 요청 바꾸기 문제
    if (ok >= 2) { T.pick[team] = true; tTell(G, team, '동맹 문제 2개 성공: 새 요청을 고르세요', 'ok'); }
    else { T.wait[team] = G.tick + TR().retrySec * RTS.HZ; tTell(G, team, `동맹 문제 ${ok}개 성공: 요청은 그대로입니다. ${TR().retrySec}초 뒤 다시 도전할 수 있습니다`, 'market'); }
    RTS.emit(G, 'tribeRel', { team, rel: 'ally', ok }); return; }
  if (ok >= 2 && !other) { T.rel[team] = 'ally'; T.req[team] = null; T.pick[team] = true; for (const o of G.teams) tTell(G, o.id, o.id === team ? `미션 2개 성공: ${name}과 동맹을 맺었습니다. 부족 패널에서 요청을 고르세요` : `${G.teams[team].name}이(가) ${name}과 동맹을 맺었습니다`, o.id === team ? 'ok' : 'market'); }
  else if (ok >= 1) { const R = TR(), ai = G.teams[team].ai; T.wait[team] = G.tick + Math.round((ai ? R.aiWait[0] + RTS.rand(G) * (R.aiWait[1] - R.aiWait[0]) : R.retrySec) * RTS.HZ); tTell(G, team, ok >= 2 ? `${name}이 이미 상대와 동맹이라 중립을 유지합니다` : `미션 1개 성공: ${name}은 중립을 유지합니다. ${TR().retrySec}초 뒤 다시 외교할 수 있습니다`, 'market'); }
  else { T.rel[team] = 'hostile'; T.nextRaid[team] = G.tick + TR().raidFirst * RTS.HZ; for (const o of G.teams) tTell(G, o.id, o.id === team ? `미션 모두 실패: ${name}이 적대 관계가 되었습니다` : `${G.teams[team].name}이(가) ${name}과 적대 관계가 되었습니다`, o.id === team ? 'warn' : 'market'); }
  RTS.emit(G, 'tribeRel', { team, rel: T.rel[team], ok }); }

RTS.addSystem({ id: 'tribe', run(G) {
  const T = G.tribe; if (!T || G.tick % RTS.HZ) return; const R = TR(), h = G.byId[T.hall];
  // 발견: 내 유닛·건물 시야 안에 회당이 들어오면
  if (h) G.teams.forEach(t => { if (T.found[t.id]) return; for (const e of G.ents) { if (e.team !== t.id || e.dead) continue; const s = (RTS.defOf(e).sight || 7) + 1.5;
    if (Math.abs(e.x - h.x) < s + 2 && Math.abs(e.y - h.y) < s + 2 && RTS.edgeDist({ def: 'none_', x: e.x, y: e.y }, h) < s) { T.found[t.id] = true; tTell(G, t.id, `${R.name} 발견: 공병으로 회당을 우클릭하면 외교 미션을 받습니다`, 'ok'); RTS.emit(G, 'tribeFound', { team: t.id }); break; } } });
  // 미션 진행
  G.teams.forEach(t => { const L = T.missions[t.id]; if (!L) return;
    for (const m of L) { if (m.done !== null) continue; const d = RTS.defs.tribeMissions[m.id]; if (d.tick) d.tick(G, t, m);
      if (!d.quiz && d.prog(G, t, m) >= d.need) { if (d.pay) for (const k of Object.keys(d.pay)) t.res[k] -= d.pay[k]; m.done = true; tTell(G, t.id, `외교 미션 성공: ${d.name}`, 'ok'); }
      else if (G.tick >= m.until) { m.done = false; tTell(G, t.id, `외교 미션 실패(시간 초과): ${d.name}` + (d.quiz ? `. ${m.q}의 답은 ${m.ans}입니다` : ''), 'warn'); } }
    if (L.every(m => m.done !== null)) tribeSettle(G, t.id); });
  if (T.dead || !h) return;
  const units = tribeUnits(G); reqInit(T);
  // 자원공유: 창고가 차고, shareEvery초마다 자원공유를 고른 동맹에게 일부를 보낸다
  for (const k of ['ore', 'gas']) T.stock[k] = Math.min(R.stockCap[k], T.stock[k] + R.stockRate[k]);
  if ((G.tick / RTS.HZ) % R.shareEvery === 0 && T.stock.ore >= R.shareMin) G.teams.forEach(t => { if (RTS.tribeReqOf(G, t.id) !== 'share' || !RTS.nearestDrop(G, { team: t.id, x: h.x, y: h.y })) return;
    const ore = Math.floor(T.stock.ore), gas = Math.floor(T.stock.gas); T.stock.ore -= ore; T.stock.gas -= gas;
    const p = RTS.nearestFree(G, h.x, h.y + 3), u = RTS.spawn(G, 't_cart', t.id, p.x, p.y); u.order = { type: 'tribeCart', ore, gas }; T.carts = (T.carts || 0) + 1;
    tTell(G, t.id, `${R.name} 수송차 출발: 광석 ${ore} · 에테르 ${gas}. 병력을 골라 수송차를 누르면 호위합니다`, 'ok'); RTS.emit(G, 'tribeCart', { team: t.id, id: u.id, ore, gas, x: u.x, y: u.y }); });
  // 병력 보충
  if (units.length < R.cap && G.tick >= T.nextSpawn) { T.nextSpawn = G.tick + R.spawnSec * RTS.HZ; tribeSpawn(G, RTS.rand(G) < .5 ? 't_warrior' : 't_archer', units.length); }
  // 한가한 병력은 회당 곁으로
  for (const u of units) if (!u.order && Math.hypot(u.x - h.x, u.y - h.y) > R.homeR) RTS.issue(G, u, { type: 'move', x: h.x + Math.cos(u.id) * 3.5, y: h.y + Math.sin(u.id) * 3.5 });
  // 적대 플레이어 습격
  G.teams.forEach(t => { if (T.rel[t.id] !== 'hostile' || G.tick < T.nextRaid[t.id]) return;
    T.nextRaid[t.id] = G.tick + Math.round((R.raidEvery[0] + RTS.rand(G) * (R.raidEvery[1] - R.raidEvery[0])) * RTS.HZ);
    const go = units.slice().sort((a, b) => Math.hypot(a.x - h.x, a.y - h.y) - Math.hypot(b.x - h.x, b.y - h.y)).slice(R.guards); if (go.length < 3) return;
    let goal = null, bd = 1e12; for (const e of G.ents) { if (e.dead || e.team !== t.id || RTS.defOf(e).kind !== 'building' || RTS.defOf(e).site) continue; const q = (e.x - h.x) ** 2 + (e.y - h.y) ** 2; if (q < bd) { bd = q; goal = e; } }
    if (!goal) return; for (const u of go) RTS.issue(G, u, { type: 'amove', x: goal.x, y: goal.y });
    tTell(G, t.id, `${R.name}이 습격해 옵니다 (${go.length}기)`, 'warn'); RTS.emit(G, 'tribeRaid', { team: t.id, n: go.length }); });
} }, { before: 'cleanup' });

// 상대 AI: 부족을 찾으면 70% 확률로 동맹을 노린다. 공병을 보내고, 광석이 모이면 수학 미션에 답한다
RTS.aiTribe = function (G, t, diff, units) { const T = G.tribe; if (!T || T.dead || t.aiState.noTribe) return; /* noTribe: 캠페인에서 외교 금지 */ const S = t.aiState, h = G.byId[T.hall], sec = G.tick / RTS.HZ; if (!h) return;
  const D = RTS.defs.entities, army = units.filter(u => !D[u.def].gather && !D[u.def].uncontrollable && u.id !== S.scout);
  if (!T.found[t.id]) { if (sec > diff.scoutAt + 40 && (!S.tScout || !G.byId[S.tScout])) { const u = army[0] || units.find(x => D[x.def].gather && !x.cargo); if (u) { S.tScout = u.id; RTS.issue(G, u, { type: 'move', x: h.x, y: h.y + 4 }); } } return; }
  if (S.tPlan === undefined) S.tPlan = RTS.rand(G) < .7 ? 'ally' : 'ignore';
  if (T.rel[t.id] === 'ally') { reqInit(T); if (T.pick[t.id]) { const r = RTS.rand(G); RTS.tribeChoose(G, t.id, r < .4 ? 'strike' : r < .75 ? 'defend' : 'share'); } return; }
  if (S.tPlan !== 'ally' || T.rel[t.id] !== 'neutral') return;
  const L = T.missions[t.id];
  if (!L) { if (RTS.tribeBlock(G, t.id)) return; const cur = S.envoy && G.byId[S.envoy]; if (cur && !cur.dead && cur.order && cur.order.type === 'envoy') return;
    const w = units.find(x => D[x.def].gather && !x.cargo && x.order && x.order.type === 'gather' && x.order.phase === 'go') || units.find(x => D[x.def].gather); if (w) { S.envoy = w.id; RTS.issue(G, w, { type: 'envoy', target: h.id }); } return; }

RTS.NET = { TURN: 2, DELAY: 3, HASH_EVERY: 25 };

// 게임 상태 요약 해시(FNV-1a). 좌표·체력은 소수 셋째 자리까지만 본다.
RTS.stateHash = function (G) {
  let h = 0x811c9dc5;
  const mix = v => { v = v | 0; for (let i = 0; i < 4; i++) { h ^= (v >>> (i * 8)) & 255; h = Math.imul(h, 0x01000193); } };
  const q = v => Math.round((v || 0) * 1000);
  mix(G.tick); mix(G.rng); mix(G.nextId); mix(G.ents.length);
  for (const e of G.ents) { mix(e.id); mix(e.team); mix(q(e.x)); mix(q(e.y)); mix(q(e.hp)); mix(e.order ? e.order.type.length : 0); mix((e.lv || 0) + (e.rank || 0) * 4 + (e.merging ? 16 : 0)); }
  for (const t of G.teams) { mix(q(t.res.ore)); mix(q(t.res.gas)); mix(t.sup); mix(t.cap); }
  if (G.market) for (const c of Object.values(G.market.cos)) { mix(q(c.price)); mix(c.owner); mix(c.free); }
  return h >>> 0;
};

// L = RTS.Lockstep({ team, send:msg=>{}, onDesync:info=>{}, start, carry })
// 게임 루프: 매 틱 전에 L.ready(G)가 참일 때만 L.inject(G); RTS.step(G);
// 상대 메시지는 L.receive(msg). 내 입력은 L.local(cmd).
// 재접속: 남아 있던 기기가 턴 경계(아직 그 턴을 넣기 전)에서 상태를 보내면, 두 기기 모두 그 상태를 복원하고
//   start = 그 턴 번호로 새 Lockstep을 만든다. start 이전 턴의 메시지와 이전 연결의 메시지(epoch가 다름)는 버린다.
//   carry: 이전 Lockstep에서 보냈지만 실행되지 못한 내 입력(L.carry()). 새 Lockstep의 첫 묶음으로 다시 보낸다.
RTS.Lockstep = function (o) {
  const N = RTS.NET, s = o.start || 0;
  const L = { team: o.team, epoch: s, pending: (o.carry || []).slice(), mine: {}, theirs: {}, sentUpTo: s + N.DELAY - 1, hashes: {}, theirHashes: {}, desync: null, stalls: 0 };
  for (let n = s; n < s + N.DELAY; n++) { L.mine[n] = []; L.theirs[n] = []; }
  L.local = cmd => { L.pending.push(cmd); };
  L.receive = msg => {
    if (msg.t !== 'turn' || (msg.e || 0) !== L.epoch || msg.n < s) return;
    L.theirs[msg.n] = msg.cmds || [];
    if (msg.hn !== undefined) { L.theirHashes[msg.hn] = msg.h; check(msg.hn); }
  };
  function check(n) {
    if (L.desync || L.hashes[n] === undefined || L.theirHashes[n] === undefined) return;
    if (L.hashes[n] !== L.theirHashes[n]) { L.desync = { turn: n, mine: L.hashes[n], theirs: L.theirHashes[n] }; if (o.onDesync) o.onDesync(L.desync); }
  }
  // 턴 경계에서 DELAY턴 뒤 묶음을 확정해 보낸다. 해시는 그 턴 시작 직전 상태 기준.
  function flush(G, n) {
    const out = n + N.DELAY; if (out <= L.sentUpTo) return;
    const msg = { t: 'turn', e: L.epoch, n: out, cmds: JSON.parse(JSON.stringify(L.pending.map(c => Object.assign({}, c, { team: L.team })))) };
    L.pending = []; L.mine[out] = msg.cmds; L.sentUpTo = out;
    if (n % N.HASH_EVERY === 0) { L.hashes[n] = RTS.stateHash(G); msg.hn = n; msg.h = L.hashes[n]; check(n); }
    o.send(msg);
  }
  L.turnOf = G => Math.floor(G.tick / N.TURN);
  L.ready = G => {
    if (G.tick % N.TURN) return true;
    const n = L.turnOf(G); flush(G, n);
    const ok = L.mine[n] !== undefined && L.theirs[n] !== undefined; if (!ok) L.stalls++; return ok;
  };
  // 턴 첫 틱에 두 묶음을 팀 번호 순서로 넣는다. 양쪽 기기가 똑같은 순서를 쓰게 하기 위해서다.
  L.inject = G => {
    if (G.tick % N.TURN) return;
    const n = L.turnOf(G), a = L.mine[n], b = L.theirs[n], list = L.team === 0 ? a.concat(b) : b.concat(a);
    for (const c of list) G.cmds.push(c);
    delete L.mine[n]; delete L.theirs[n];
    for (const k of Object.keys(L.hashes)) if (k < n - 200) { delete L.hashes[k]; delete L.theirHashes[k]; }
  };
  L.advance = G => { if (G.over || !L.ready(G)) return false; L.inject(G); RTS.step(G); return true; };
  // 아직 실행되지 않은 내 입력(보낸 묶음 + 대기 중). 재접속 때 새 Lockstep으로 넘긴다
  L.carry = () => { const out = []; for (const k of Object.keys(L.mine).map(Number).sort((a, b) => a - b)) out.push(...L.mine[k]); return out.concat(L.pending).map(c => { const x = Object.assign({}, c); delete x.team; return x; }); };
  return L;
};
// 재접속 지점: 턴 경계이고 그 턴을 아직 넣지 않았을 때만 상태를 보낼 수 있다
RTS.syncPoint = G => G.tick % RTS.NET.TURN === 0;

// 두 사람 게임 시작 옵션. 호스트가 만들어 상대에게 그대로 보낸다.
// hc: 팀별 핸디캡 단계 id(RTS.HANDICAPS), 0번 팀이 호스트.
// 두 사람은 서로 다른 진영을 고르고, 남은 진영이 중립세력(2번 팀 AI)이 된다. 중립세력은 서로 대전(1:1:1)과 협동에 나온다.
//   duel: 1:1 대전. 중립세력 없이 두 사람만 싸운다.
//   coop: 두 사람이 같은 편(side 0), 중립세력은 side 1. 아니면 셋이 모두 서로 적이다(마지막까지 남는 쪽이 승리).
//   boost: 보통 AI 대비 성능 배율(기본 1.3), level: 기준 난이도
RTS.COOP = { name: '중립세력', level: 'normal', boost: 1.3, boosts: [1, 1.15, 1.3, 1.5, 1.7] };
RTS.restFaction = used => Object.keys(RTS.defs.factions).find(f => !used.includes(f)) || used[0];
RTS.netGameOpts = function (o) {
  const p = [{ faction: o.factions[0], name: o.names[0], hc: o.hc[0] }, { faction: o.factions[1], name: o.names[1], hc: o.hc[1] }];
  if (o.duel && !o.coop) return { map: o.map, seed: o.seed, settings: o.settings, net: true, coop: false, players: p };
  if (o.coop) p.forEach(x => { x.side = 0; });
  const n = { faction: o.enemy || RTS.restFaction(o.factions), name: RTS.COOP.name, ai: o.level || RTS.COOP.level, boost: o.boost || RTS.COOP.boost };
  if (o.coop) n.side = 1;
  p.push(n);
  return { map: o.map, seed: o.seed, settings: o.settings, net: true, coop: !!o.coop, players: p };
};

// campaign.js — 캠페인 모드. 이어지는 이야기 속 미션을 차례로 깬다.
// 미션 데이터는 src/data/campaign.js의 RTS.CAMPAIGN. 게임 상태에는 G.camp(미션 id, 단계, 깃발·누적값)만 들어가서 저장·이어하기와 두 기기 결정성이 유지된다.
//
// 묶음(RTS.CAMPAIGN.groups): solo(진영별 1인 5단계) · duo(2인 5단계) · hidden(히든 미션) · deep(히든 캠페인 3단계)
// 미션: { id, title, map, brief, levels, players, teams, setup(G, carry), stages, events, win, end }
//   teams: [{ role: 'me'|'mate'|'foe'|'npc', faction, ai, base(기지 번호 또는 null), noBase, boost, name }]
//     - 'me'는 0번 사람. 'mate'는 2인이면 1번 사람, 1인으로 하면 AI 동료가 된다. 'foe'는 적 AI, 'npc'는 제자리를 지키는 수비대(AI 없음).
//     - faction이 'A'·'B'면 2인 미션에서 두 사람이 고른 진영, 'C'는 남은 진영.
//   stages: [{ say, goals: [goal], enter(G), fail(G), marks(G) }]
//   events: [{ at | every, from, stage, when, run(G, n) }] — stage가 있으면 그 단계에서만, 시간도 그 단계 시작부터 센다. every 간격은 난이도가 높을수록 짧아진다(÷√k)
//   goal: { text, prog(G) → [현재, 목표] }  ─ 매번 계산
//         { text, key, test(G), done(G) }  ─ 한 번 채우면 유지(latch). done은 채우는 순간 한 번 실행(구조한 부대 합류 등)
//         { text, key, acc(G), need }     ─ acc가 참인 동안 초를 쌓는다(거점 지키기)
//   지점 표식: 단계의 marks(G) → [{ x, y, r, label, done }] (화면·미니맵에 그린다. 게임 상태가 아니다)
// 단계 목표를 모두 채우면 다음 단계, 마지막 단계를 마치면 승리. 사람 팀(G.camp.ps)이 모두 쓰러지거나 단계의 fail(G)이 문장을 돌려주면 실패.
RTS.campAll = () => (RTS.CAMPAIGN ? RTS.CAMPAIGN.groups.flatMap(g => g.missions.map(m => Object.assign(m, { group: g.id }))) : []);
RTS.campDef = id => RTS.campAll().find(m => m.id === id) || null;
RTS.campGroup = id => (RTS.CAMPAIGN ? RTS.CAMPAIGN.groups.find(g => g.id === id) : null);
RTS.campIndex = id => { const M = RTS.campDef(id), g = M && RTS.campGroup(M.group); return g ? g.missions.indexOf(M) : -1; };
RTS.campNext = id => { const M = RTS.campDef(id), g = M && RTS.campGroup(M.group); return g ? g.missions[g.missions.indexOf(M) + 1] || null : null; };
// 난이도: 적 AI 단계와 스크립트 부대 크기 배율 k
RTS.CAMP_LEVELS = { easy: { name: '쉬움', ai: 'beginner', k: .7 }, normal: { name: '보통', ai: 'easy', k: 1 }, hard: { name: '어려움', ai: 'normal', k: 1.35 } };
// 미션이 고를 수 있는 난이도. 미션의 levels가 없으면 세 단계 모두
RTS.campLevels = M => M.levels || ['easy', 'normal', 'hard'];
RTS.campK = G => (RTS.CAMP_LEVELS[G.camp.level] || RTS.CAMP_LEVELS.normal).k * (G.camp.duo ? 1.15 : 1); // 두 사람이면 스크립트 부대 1.15배

// 미션 시작 옵션. mode: { duo(두 사람), factions: [A, B], names } — duo가 아니면 'mate'는 AI 동료
RTS.campGameOpts = function (id, level, seed, settings, carry, mode) {
  const M = RTS.campDef(id), mo = mode || {}, lv = RTS.campLevels(M).includes(level) ? level : RTS.campLevels(M)[Math.min(1, RTS.campLevels(M).length - 1)], L = RTS.CAMP_LEVELS[lv];
  const fs = Object.keys(RTS.defs.factions), A = (mo.factions && mo.factions[0]) || M.faction || fs[0], B = (mo.factions && mo.factions[1] && mo.factions[1] !== A ? mo.factions[1] : fs.find(f => f !== A));
  const pick = f => f === 'A' ? A : f === 'B' ? B : f === 'C' ? fs.find(x => x !== A && x !== B) : f;
  const duo = !!mo.duo && M.players !== 1;
  const players = [], starts = [];
  M.teams.forEach((T, i) => { const f = pick(T.faction), p = { faction: f, side: T.role === 'me' || T.role === 'mate' ? 0 : 1 };
    if (T.role === 'me') { p.name = (mo.names && mo.names[0]) || T.name || RTS.defs.factions[f].name; if (T.noBase) p.noBase = true; }
    else if (T.role === 'mate') { if (duo) { p.name = (mo.names && mo.names[1]) || '동료'; if (T.noBase) p.noBase = true; } else { p.ai = T.allyAi || 'normal'; p.name = (T.name || RTS.defs.factions[f].name) + ' (AI 동료)'; } }
    else if (T.role === 'npc') { p.npc = true; p.name = T.name || '수비대'; }
    else { p.ai = (T.ai && T.ai[lv]) || L.ai; p.boost = (T.boost && typeof T.boost === 'object' ? T.boost[lv] : T.boost) || 1; p.name = T.name || RTS.defs.factions[f].name; } // boost: 숫자 또는 난이도별 { normal, hard }
    players.push(p); starts.push(T.base === undefined ? null : T.base); });
  return { map: M.map, seed, coop: true, net: !!mo.duo, starts, settings: Object.assign({}, settings, M.settings || {}),
    camp: { id, level: lv, carry: carry || {}, duo }, players };
};
RTS.initCampaign = function (G, c) { const M = RTS.campDef(c.id); if (!M) return;
  const ps = M.teams.map((T, i) => (T.role === 'me' || (T.role === 'mate' && c.duo) ? i : -1)).filter(i => i >= 0);
  G.camp = { id: c.id, level: c.level, duo: !!c.duo, ps, carry: c.carry || {}, stage: 0, t0: 0, flags: {}, ev: {}, result: null };
  M.teams.forEach((T, i) => { const t = G.teams[i]; if (t && t.ai) { Object.assign(t.aiState, T.aiState || {}); if (t.aiState.hold && T.role === 'foe') { t.inc0 = t.inc; t.inc *= RTS.CAMP_HOLD_INC; } } }); // 공격을 보류한 적은 그동안 수입을 줄인다(풀릴 때 RTS.camp.unhold로 되돌림)
  if (M.setup) M.setup(G, G.camp.carry);
  G.camp.stage = -1; }; // 첫 단계는 첫 틱에 연다(화면이 대사를 받을 수 있도록)
const campSay = (G, lines) => { if (typeof lines === 'function') lines = lines(G); for (const [who, text] of lines || []) RTS.emit(G, 'story', { who, text }); };
RTS.campSay = (G, who, text) => RTS.emit(G, 'story', { who, text });
function campEnter(G, i) { const M = RTS.campDef(G.camp.id), S = M.stages[i]; G.camp.stage = i; G.camp.t0 = G.tick; if (!S) return;
  if (S.enter) S.enter(G); campSay(G, S.say); RTS.emit(G, 'campStage', { stage: i }); }
const goalProg = (G, g) => g.key ? (g.acc ? [Math.floor(G.camp.flags[g.key] || 0), g.need] : [G.camp.flags[g.key] ? 1 : 0, 1]) : g.prog(G);
RTS.campStageSec = G => (G.tick - (G.camp.t0 || 0)) / RTS.HZ;
// 지금 단계 목표의 진행도 [{text, cur, need, done}]
RTS.campGoals = function (G) { const M = G.camp && RTS.campDef(G.camp.id), S = M && M.stages[Math.max(0, G.camp.stage)]; if (!S) return [];
  return S.goals.map(g => { const [cur, need] = goalProg(G, g); return { text: typeof g.text === 'function' ? g.text(G) : g.text, cur: Math.min(cur, need), need, done: cur >= need }; }); };
RTS.campMarks = function (G) { const M = G.camp && RTS.campDef(G.camp.id), S = M && M.stages[Math.max(0, G.camp.stage)]; if (!S) return [];
  const out = (S.marks ? S.marks(G) : null) || []; for (const g of S.goals) if (g.at) { const [c, n] = goalProg(G, g); if (c < n) out.push({ x: g.at[0], y: g.at[1], r: g.at[2], label: g.at[3] }); }
  return out; };
function campEnd(G, win, why) { if (G.over) return; const M = RTS.campDef(G.camp.id);
  G.camp.result = { win, why: why || '' }; if (win) { campSay(G, M.win); if (M.end) campSay(G, M.end); } else if (why) RTS.emit(G, 'story', { who: '', text: why });
  G.over = { winner: win ? 0 : 1, side: win ? 0 : 1, tick: G.tick, camp: true }; RTS.emit(G, 'gameover', G.over); }
RTS.campEnd = campEnd;

RTS.addSystem({ id: 'campaign', run(G) {
  const C = G.camp; if (!C || G.over || G.tick % 10) return; const M = RTS.campDef(C.id); if (!M) return; const sec = G.tick / RTS.HZ;
  if (C.stage < 0) campEnter(G, 0);
  for (let i = 0; i < (M.events || []).length; i++) { const e = M.events[i], k = 'e' + i;
    if (e.stage !== undefined && ![].concat(e.stage).includes(C.stage)) continue;
    if (e.when && !e.when(G)) continue;
    const T = e.stage !== undefined ? RTS.campStageSec(G) : sec; // 단계에 묶인 사건은 그 단계가 시작된 뒤 시간으로 센다
    if (e.at !== undefined && !C.ev[k] && T >= e.at) { C.ev[k] = 1; e.run(G); }
    if (e.every && T >= (e.from || 0) && T >= (C.ev[k] || 0)) { const ev = e.every * (e.scale === false ? 1 : 1 / Math.sqrt(RTS.campK(G))); C.ev[k] = T + ev; C.ev[k + 'n'] = (C.ev[k + 'n'] || 0) + 1; e.run(G, C.ev[k + 'n']); } }
  // 패배: 사람 팀의 유닛·건물이 모두 없어짐(본진 없이 시작하는 미션이 있어 유닛도 센다)
  RTS.census(G); if (C.ps.every(i => !G.ents.some(e => e.team === i && !e.dead && !RTS.defs.entities[e.def].site))) { campEnd(G, false, C.ps.length > 1 ? '두 사람의 부대가 모두 쓰러졌습니다' : '부대가 모두 쓰러졌습니다'); return; }
  const S = M.stages[C.stage]; if (!S) return;
  for (const g of S.goals) if (g.key) { // 유지되는 목표는 여기(시뮬레이션 안)에서만 갱신한다. 화면은 읽기만 한다
    if (g.acc) { if ((C.flags[g.key] || 0) < g.need && g.acc(G)) C.flags[g.key] = Math.min(g.need, (C.flags[g.key] || 0) + .5); }
    else if (!C.flags[g.key] && g.test(G)) { C.flags[g.key] = 1; if (g.done) g.done(G); } }
  const why = S.fail && S.fail(G); if (why) { campEnd(G, false, why); return; }
  if (S.goals.every(g => { const [cur, need] = goalProg(G, g); return cur >= need; })) { if (C.stage + 1 >= M.stages.length) campEnd(G, true); else campEnter(G, C.stage + 1); }
} }, { before: 'victory' });

// 미션 스크립트용 도구
const CD = () => RTS.defs.entities;
RTS.camp = {
  hq: (G, team) => G.ents.find(e => e.team === team && !e.dead && CD()[e.def].dropoff && CD()[e.def].kind === 'building'),
  // 사람 팀(혼자면 [0], 둘이면 [0, 1])
  ps: G => G.camp.ps,
  // 난이도 배율을 곱한 부대 수(최소 1)
  n: (G, base) => Math.max(1, Math.round(base * RTS.campK(G))),
  // (x, y) 둘레에 유닛을 만든다. goal이 있으면 공격 이동. 만든 유닛 id 목록
  spawnAt(G, team, list, x, y, goal) { const ids = [];
    list.forEach((id, k) => { const a = k * 1.3, rr = 1.5 + k * .35, p = RTS.nearestFree(G, x + Math.cos(a) * rr, y + Math.sin(a) * rr), u = RTS.spawn(G, id, team, p.x, p.y); ids.push(u.id); if (goal) RTS.issue(G, u, { type: 'amove', x: goal.x, y: goal.y }); });
    return ids; },
  // team 쪽 본진 근처(없으면 맵 반대편)에 유닛을 만들어 목표로 공격 이동
  wave(G, team, list, goal) { const h = RTS.camp.hq(G, team) || { x: G.w - 10, y: G.h - 10 }; return RTS.camp.spawnAt(G, team, list, h.x, h.y + 3, goal); },
  // 완공된 건물을 놓는다(자리가 막히면 가까운 빈자리). lv: 강화 단계(단계당 체력 +25%·방어 +1, 보스 건물용). 만든 건물
  building(G, team, def, x, y, lv) { const d = CD()[def], tx0 = Math.round(x - d.size[0] / 2), ty0 = Math.round(y - d.size[1] / 2);
    for (let r = 0; r < 8; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue; const tx = tx0 + dx, ty = ty0 + dy;

  // 기지 하나를 통째로: 본진 + 일꾼 n
  base(G, team, x, y, workers) { const f = RTS.defs.factions[G.teams[team].faction], hq = RTS.camp.building(G, team, f.hq, x, y); if (!hq) return null;
    const ore = RTS.nearestNode(G, hq.x, hq.y, 'ore', 30);

  alive: (G, ids) => (ids || []).filter(i => { const e = G.byId[i]; return e && !e.dead; }).length,
  count: (G, team, def) => G.ents.filter(e => e.team === team && !e.dead && e.def === def && (CD()[e.def].kind !== 'building' || RTS.complete(e))).length,

  // 진영 역할로 세기: 'hq'·'worker'·'supply'·'defense' 또는 정의 id. 사람 팀마다 자기 진영 기준
  countRole: (G, role, team) => [].concat(team === undefined ? G.camp.ps : team).reduce((s, t) => s + RTS.camp.count(G, t, RTS.camp.rid(G.teams[t].faction, role)), 0),
  // 역할 이름 → 그 진영의 정의 id: hq·worker·supply·defense(진영 데이터), barracks·lab·factory(RTS.CAMP_ROLE)
  rid: (faction, role) => (RTS.CAMP_ROLE[role] && RTS.CAMP_ROLE[role][faction]) || RTS.defs.factions[faction][role] || role,
  // 사람 유닛(건물 제외)이 (x, y)에서 r 안에 있나. each면 사람 팀마다 하나씩 있어야 한다

  // (x, y)에서 r 안의 적 유닛 수(사람 편이 아닌 팀)
  foesNear(G, x, y, r) { let n = 0; for (const e of G.ents) if (!e.dead && e.team >= 0 && G.teams[e.team].side === 1 && CD()[e.def].kind === 'unit' && (e.x - x) ** 2 + (e.y - y) ** 2 <= r * r) n++; return n; },
  // 사람 팀 건물 중 from에 가장 가까운 것(없으면 유닛)

  // 적 팀 번호(foe 역할)

// ── 진행·해금 규칙 ─────────────────────────────────────
// 진행 기록 p = { done: { 미션id: { best, level, hard } }, carry: {}, level }
// · 1인: 진영마다 앞 미션을 깨야 다음이 열린다.
// · 2인: 어느 진영이든 1인 5단계를 끝까지 깨면 열린다(RTS.CAMP_RULES.duoNeed: 'any' 한 진영, 'all' 세 진영 모두).
// · 히든 미션: 2인 마지막 미션을 어려움으로 깨면 열린다. 쉬움·보통으로 깨면 힌트만 보인다.
// · 히든 캠페인: 히든 미션을 깨면 열린다(1단계부터 차례로).
RTS.CAMP_RULES = { duoNeed: 'any' };
// · 학습 미션: 성공한 뒤 푸는 관문(learn: false로 기록)이 남아 있으면 그 미션은 아직 다음을 열지 않는다(RTS.campLearnDone으로 풀면 열린다).
RTS.campStatus = function (p) {

  const solo = G.filter(g => g.kind === 'solo'), duo = G.find(g => g.kind === 'duo'), hid = G.find(g => g.kind === 'hidden'), deep = G.find(g => g.kind === 'deep');
  const soloDone = solo.filter(g => done(last(g).id)).length;
  const duoOpen = RTS.CAMP_RULES.duoNeed === 'all' ? soloDone === solo.length : soloDone > 0;
  const duoLast = done(last(duo).id) && p.done[last(duo).id], hidOpen = !!(duoLast && duoLast.hard), hint = !!duoLast && !hidOpen;
  const deepOpen = hidOpen && done(hid.missions[0].id);
  const groupOpen = g => g.kind === 'solo' || (g.kind === 'duo' && duoOpen) || (g.kind === 'hidden' && hidOpen) || (g.kind === 'deep' && deepOpen);
  const open = id => { const M = RTS.campDef(id); if (!M) return false; const g = RTS.campGroup(M.group); if (!groupOpen(g)) return false; const i = g.missions.indexOf(M); return i === 0 || done(g.missions[i - 1].id); };
  return { soloDone, duoOpen, hidOpen, hint, deepOpen, groupOpen, open, visible: g => g.kind === 'solo' || g.kind === 'duo' || (g.kind === 'hidden' && (hidOpen || hint)) || (g.kind === 'deep' && deepOpen) };
};
// 미션을 깼을 때 기록에 넣는다(p를 고쳐서 돌려준다)
// learnLater: 성공 뒤 학습 관문이 남았으면 true(이미 푼 적이 있으면 그대로 풀린 상태)
RTS.campRecord = function (p, id, level, ticks, learnLater) { p.done = p.done || {}; const d = p.done[id];
  p.done[id] = { best: d && d.best && d.best < ticks ? d.best : ticks, level: d && levelRank(d.level) > levelRank(level) ? d.level : level, hard: !!(d && d.hard) || level === 'hard' };

// ── 학습 난이도 단계 ── 설정한 학습 수준(학년)은 그대로 두고, 그 안에서 캠페인 진행과 미션 난이도에 따라 어려워진다.
// 단계 s는 -1(쉽게) ~ 0(기본) ~ 1(어렵게).
//   수학: 수 범위 안에서 큰 수 쪽으로(s<0이면 작은 수 쪽으로) 치우쳐 고른다. s가 up을 넘으면 한 수준 위 문제가, -down 아래면 한 수준 아래 문제가 섞인다.
//   국어·통합교과: s>0이면 그 수준에서 새로 나오는 문항(lv[0]이 그 수준), s<0이면 아래 수준부터 이어지는 문항을 더 자주 고른다.
RTS.LEARN_STEP = {
  start: -.5, span: 1.3,                         // 캠페인 첫 미션 -0.5 → 마지막 미션 +0.8 (보통 기준)
  levels: { easy: -.3, normal: 0, hard: .3 },    // 미션 난이도 쉬움·보통·어려움
  up: .3, down: .3, mix: .5,                     // 위·아래 수준이 섞이는 확률 = (|s| - 문턱) × mix → s = ±1에서 35%
  names: [[-.5, '쉽게'], [-.15, '조금 쉽게'], [.2, '기본'], [.55, '조금 어렵게'], [9, '어렵게']],
};
// 캠페인 미션 M과 난이도(easy·normal·hard)의 학습 단계. 진행 순서: 1인 5장 → 2인 5장 → 히든 미션 → 히든 캠페인 3장
RTS.learnStep = function (M, level) { const S = RTS.LEARN_STEP; if (!M) return 0;
  const g = RTS.campGroup(M.group), order = ['solo', 'duo', 'hidden', 'deep'], base = { solo: 0, duo: 5, hidden: 10, deep: 11 }, last = 13;
  const pos = g ? (base[g.kind] || 0) + Math.max(0, RTS.campIndex(M.id)) : 0, k = order.includes(g && g.kind) ? pos / last : 0;
  return Math.max(-1, Math.min(1, S.start + S.span * k + (S.levels[level] || 0))); };
RTS.learnStepName = s => RTS.LEARN_STEP.names.find(x => s < x[0])[1];
// 단계만큼 치우친 정수 뽑기: s>0이면 범위의 위쪽, s<0이면 아래쪽으로(최대 범위의 절반만큼)
RTS.learnRi = (R, s) => (a, b) => { let u = R(); const k = Math.max(-1, Math.min(1, s || 0)) * .5; u = k >= 0 ? k + u * (1 - k) : u * (1 + k); return a + Math.min(b - a, Math.floor(u * (b - a + 1))); };

  root.addEventListener('pointerdown', anyTap, true);
  root.addEventListener('pointerdown', e => { if (app.pop && !$('k-pop').contains(e.target)) { closePop(); app.popShut = performance.now(); } }, true); // 팝업을 닫는 탭은 명령으로 쓰지 않는다
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); }, true); window.addEventListener('keydown', anyTap, true);
  $('k-ver').textContent = '버전 ' + (RTS.BUILD || '개발');

  // ── 루프 ──────────────────────────────────────────────
  function layout() { const r = $('k-stage').getBoundingClientRect(), W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height)); if (view.width !== W || view.height !== H) { view.width = W; view.height = H; clampCam(); } }
  const ro = new ResizeObserver(layout); ro.observe($('k-stage'));
  let lastT = performance.now(), acc = 0, raf = 0, alive = true; const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function loop(now) { if (!alive) return; raf = requestAnimationFrame(loop); const dt = Math.min(250, now - lastT); lastT = now; app.frame++; diagBeat(); if (app.frame % 3600 === 0) autoSave(); const G = app.G; if (!G) return;
    if (app.net && (app.net.L || app.net.match) && !app.demo) { // 둘이 대전: 양쪽 입력이 모인 턴만 진행. 늦은 쪽이 따라잡도록 한 프레임에 최대 6틱
      const N = app.net; if (N.match) netTick(N, G);
      if (N.L && !app.paused && !G.over && app.G === G) { acc += dt; const per = 1000 / RTS.HZ; let n = 0, stuck = false; while (acc >= per && n < 6) { if (N.syncTo && RTS.syncPoint(G)) { doSync(); break; } if (!N.L.advance(G)) { stuck = true; acc = Math.min(acc, per * 3); break; } acc -= per; n++; }
        if (stuck) { N.waitMs = (N.waitMs || 0) + dt; } else N.waitMs = 0; $('k-wait').hidden = !(N.waitMs > 700) || !!N.away || !!N.resync; }
      else { acc = 0; $('k-wait').hidden = true; } }
    else if (!app.paused && !G.over && (app.demo || !app.setOpen)) { acc += dt * (app.demo ? 1.5 : app.speed); const per = 1000 / RTS.HZ; let n = 0; while (acc >= per && n < 6) { RTS.step(G); acc -= per; n++; } if (n === 6) acc = 0; }
    if (app.demo) { if (!reduce) { const fight = G.ents.find(e => e.firedAt > G.tick - 20 && RTS.defOf(e).kind === 'unit'); if (fight) { const tx = fight.x * TS - view.width / 2, ty = fight.y * TS - view.height / 2; cam.x += (tx - cam.x) * .006; cam.y += (ty - cam.y) * .006; clampCam(); } } }
    else { const m = app.mouse, sp = 14 / cam.z, e = 12; let dx = 0, dy = 0; if (keys.ArrowLeft) dx = -sp; if (keys.ArrowRight) dx = sp; if (keys.ArrowUp) dy = -sp; if (keys.ArrowDown) dy = sp;
      if (app.settings.edgeScroll && m.inside && !drag.on && matchMedia('(pointer:fine)').matches) { if (m.x < e) dx = -sp; else if (m.x > view.width - e) dx = sp; if (m.y < e) dy = -sp; else if (m.y > view.height - e) dy = sp; }
      if (dx || dy) { cam.x += dx; cam.y += dy; clampCam(); [m.wx, m.wy] = toWorld(m.x, m.y); }
      view.style.cursor = app.mode ? 'crosshair' : 'default';
      if (app.frame % 12 === 0) { renderHud(); renderObj(); { const sg = app.sel.join(); if (sg !== app.selVoice) { const u = app.sel.length && G.byId[app.sel[0]]; if (app.selVoice !== undefined && u && !u.dead && u.team === app.team && RTS.defOf(u).kind === 'unit') unitVoice(u, 'select'); app.selVoice = sg; } } // 고른 유닛 대답 // 셋 이상 게임에서 나만 전멸하면 패배를 알리고 관전으로 남는다(두 기기 계산은 계속 돌아야 한다)
        if (G.teams.length > 2 && !G.over && !app.outShown && G.teams[app.team] && (G.camp ? !G.ents.some(e => e.team === app.team && !e.dead) : G.teams[app.team].alive === 0)) { app.outShown = true; if (G.camp) notice('내 부대가 모두 쓰러졌습니다. 동료가 남아 있으면 미션은 계속됩니다', 'warn'); else finish(null, true); } } }
    if (app.frame % 15 === 0 && !app.demo) renderMini();
    if (music && app.frame % 12 === 0) { if (!app.demo && !G.over) { if (G.ents.some(e => e.team === app.team && e.firedAt > G.tick - 8)) app.heat = Math.max(app.heat || 0, .75); app.heat = (app.heat || 0) * .965; music.setIntensity(Math.max(app.heat, Math.min(.3, G.tick / 20 / 900))); } if (app.frame % 36 === 0) applyMusic(); }
    R.draw(Math.min(1, acc / (1000 / RTS.HZ))); }
  // ── 진단 ── 태블릿처럼 개발자 도구가 없는 기기에서도 원인을 알 수 있게 기록한다.
  // ① 코드 오류: 화면 알림 + 저장(lastErr) ② 게임 중 탭이 강제로 다시 열림(메모리 부족 등): 게임 중이면 5초마다 표식(alive)을 남기고, 정상으로 끝나거나 직접 닫으면 지운다. 다음에 열 때 표식이 남아 있으면 시작 화면에 알린다
  const errRec = (msg, src, stack) => { const r = { at: Date.now(), msg: String(msg || '알 수 없는 오류').slice(0, 160), src: src || '', stack: String(stack || '').split('\n').slice(0, 4).join(' | ').slice(0, 400), game: app.G && !app.demo ? diagWhat() : '' }; store.set('lastErr', JSON.stringify(r)); try { notice('오류: ' + r.msg + (r.src ? ' (' + r.src + ')' : ''), 'warn'); } catch (e) {} };
  const onErr = e => errRec(e.message || (e.error && e.error.message), (e.filename || '').split('/').pop() + ':' + (e.lineno || 0) + ':' + (e.colno || 0), e.error && e.error.stack);
  const onRej = e => { const r = e.reason; errRec('처리 안 된 오류: ' + (r && r.message || r), '', r && r.stack); };

  function diagWhat() { const G = app.G, N = app.net; return (G.camp ? (RTS.campDef(G.camp.id) || {}).title || G.camp.id : N ? '둘이 하기' : '혼자 하기') + (N ? (N.role === 'host' ? ' · 방장' : ' · 참가') : '') + ' · ' + Math.floor(G.tick / 1200) + '분 ' + Math.floor(G.tick / 20) % 60 + '초 진행' + (app.settings.lowSpec ? ' · 저사양 모드' : ' · 저사양 모드 꺼짐'); }
  function diagBeat() { const G = app.G, on = G && !app.demo && !G.over; if (on) { if (app.frame % 150 === 0 || !app.aliveOn) { store.set('alive', JSON.stringify({ at: Date.now(), what: diagWhat() })); app.aliveOn = true; } } else if (app.aliveOn) { store.del('alive'); app.aliveOn = false; } }
  const onHide = () => { store.del('alive'); app.aliveOn = false; }; window.addEventListener('pagehide', onHide); // 새로고침·닫기는 강제 종료가 아니다
  { let a = null, er = null; try { a = JSON.parse(store.get('alive') || 'null'); er = JSON.parse(store.get('lastErr') || 'null'); } catch (e) {} store.del('alive');
    const fresh = x => x && Date.now() - x.at < 30 * 60 * 1000, ago = x => Math.max(0, Math.round((Date.now() - x.at) / 60000)) + '분 전';
    const L = []; if (fresh(a)) L.push(`지난 게임이 정상으로 끝나지 않고 화면이 다시 열렸습니다(${a.what}, ${ago(a)}). 브라우저가 메모리 부족 등으로 탭을 다시 연 것일 수 있습니다.`);
    if (fresh(er)) L.push(`최근 오류(${ago(er)}): ${er.msg}${er.src ? ' · ' + er.src : ''}${er.game ? ' · ' + er.game : ''}`);
    if (L.length) { const el = $('k-diag'); el.textContent = L.join(' / '); el.hidden = false; el.title = er && er.stack || ''; } }
  renderMenu(); layout(); demo(); raf = requestAnimationFrame(loop);
  // 둘이 하기 중에 탭이 닫혔다 다시 열렸으면(새로고침·메모리 부족 등) 시작 화면을 거치지 않고 바로 다시 접속한다
  if (!opts.autostart) { const r = loadResume(); if (r) setTimeout(() => { if (alive && !app.net && (app.demo || !app.G)) netRejoin(r); }, 300); }
  if (opts.autostart) app.start(opts.autostart);
  app.destroy = () => { clearInterval(playTimer); if (app.net) netClose(true); if (music) music.stop(); window.removeEventListener('keydown', anyTap, true); window.removeEventListener('error', onErr); window.removeEventListener('unhandledrejection', onRej); window.removeEventListener('pagehide', onHide); root.removeEventListener('pointerup', guardTap, true); window.removeEventListener('keyup', guardTap, true); window.removeEventListener('popstate', onPop); window.removeEventListener('beforeunload', onBefore); window.removeEventListener('pagehide', autoSave); document.removeEventListener('visibilitychange', onVis); document.removeEventListener('fullscreenchange', onFs); window.removeEventListener('beforeinstallprompt', onInst); alive = false; cancelAnimationFrame(raf); ro.disconnect(); window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', offKey); root.innerHTML = ''; };
  return app;
};

<script>
function boot(data){
  const app=RTS.mount(document.getElementById('kr-app'));
  if(data&&data.save)app.loadState(data.save);
