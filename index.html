<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>광맥전선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 레이아웃: 전장이 화면을 채우고, 위아래 금속 콘솔이 조작부가 된다. 한 가지 다크 룩으로 고정한다. */
:root{color-scheme:dark;
  --ink:#10151f;--panel:#1b2433;--panel2:#26324a;--line:#46587a;--brass:#d2a85a;--text:#e8edf5;--dim:#9fb0c8;
  --ore:#ffc247;--gas:#ea7be0;--ok:#58e08a;--warn:#f2c14e;--bad:#ee5545;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"Chakra Petch","IBM Plex Sans KR",monospace;
  --cut:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden}
#kr-app{height:100%}
.k-game{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;font-size:14px}
.k-game button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);cursor:pointer;padding:6px 10px;touch-action:manipulation}
.k-game button:hover{border-color:var(--brass)}
.k-game button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.k-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border-bottom:2px solid var(--brass);padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.k-res{display:flex;gap:14px}
.k-chip{display:inline-flex;align-items:center;gap:6px;font:700 17px var(--num);font-variant-numeric:tabular-nums}
.k-chip i{width:13px;height:13px;display:block;transform:rotate(45deg)}
.k-chip.ore i{background:var(--ore)}.k-chip.gas i{background:var(--gas);border-radius:50%}.k-chip.sup i{background:var(--ok);clip-path:polygon(50% 0,100% 100%,0 100%);transform:none}
.k-chip.full b{color:var(--bad)}
.k-clock{font:700 17px var(--num);color:var(--brass);font-variant-numeric:tabular-nums}
.k-tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.k-tools button{padding:4px 9px;font-size:13px}
.k-tools button.on{background:var(--brass);color:#16110a}
.k-touch{display:none}
@media (pointer:coarse){.k-touch{display:inline-block}}
.k-stage{position:relative;min-height:0;background:#0a0f18}
#k-view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.k-msgs{z-index:5;position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:min(90%,420px)}
.k-msg{background:rgba(16,21,31,.88);padding:4px 12px;border-left:3px solid var(--dim);font-size:14px}

.k-msg.market{border-color:var(--brass);color:#ffe6b0}
.k-tools button.k-ex-open{background:var(--brass);color:#16110a;font-weight:600}
.k-tools button.k-ex-open.on{background:var(--panel2);color:var(--brass)}
.k-ex{box-sizing:border-box;position:absolute;top:0;left:0;bottom:0;z-index:4;width:min(430px,100%);overflow:auto;background:rgba(16,21,31,.95);border-right:2px solid var(--brass);padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;display:flex;flex-direction:column;gap:8px}
.x-head{display:flex;align-items:center;gap:10px}.x-head h2{margin:0;font:400 22px var(--display);color:var(--brass)}.x-head span{font:700 14px var(--num);color:var(--dim)}.x-head button{margin-left:auto;padding:3px 9px}
.x-sum{display:flex;gap:16px;color:var(--dim)}.x-sum b{font:700 15px var(--num);color:var(--text)}
#x-rows{display:grid;gap:7px}
.x-row{display:grid;gap:4px;background:var(--panel);padding:7px 8px;border-left:3px solid var(--ore)}.x-row.gas{border-left-color:var(--gas)}
.x-top{display:grid;grid-template-columns:minmax(0,1fr) 90px 62px;gap:6px;align-items:center}
.k-game .x-name{all:unset;cursor:pointer;display:grid;min-width:0}.x-name b{font-size:15px}.x-name small{font-size:12px;color:var(--dim)}.k-game .x-name:focus-visible{outline:2px solid var(--brass)}
.x-top svg{width:90px;height:28px;display:block}
.x-price{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}.x-price b{display:block;font-size:17px}.x-price small{font-size:12px}.x-price .up{color:#ff8a7a}.x-price .dn{color:#7fbcff}
.x-stake{position:relative;height:7px;background:var(--panel2);display:flex;justify-content:space-between}.x-stake i{display:block;height:100%}.x-stake .me{background:#46c4ff}.x-stake .foe{background:#ff7350}.x-stake s{position:absolute;left:51%;top:-2px;bottom:-2px;width:2px;background:var(--text)}
.x-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}.x-pay.bad{color:#ff8a7a}
.x-btn{display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;gap:4px}.k-game .x-btn button{padding:4px 0;font-size:13px}.k-game .x-btn button:disabled{opacity:.38;cursor:default}
.x-war h3{margin:0 0 3px;font-size:12px;letter-spacing:.14em;color:var(--brass);font-weight:600}.x-war p{margin:3px 0 0;font-size:12.5px;color:var(--dim)}
.x-base{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--dim);background:var(--panel);padding:5px 8px;margin-bottom:3px;border-left:3px solid var(--line)}.x-base b{color:var(--text)}.x-base.hot{border-left-color:var(--bad)}.x-base .low{color:#ff9d90}
.x-news{font-size:13px;color:var(--dim)}.x-news p{margin:0;padding:2px 0}.x-news time{font-family:var(--num);color:var(--brass);margin-right:6px}
.d-help{margin:0;font-size:13px;line-height:1.5;color:var(--dim)}
#d-rows{display:grid;gap:7px}
.d-row{display:grid;gap:4px;background:var(--panel);padding:8px;border-left:3px solid var(--brass)}.d-row small{font-size:12.5px;color:var(--dim)}.d-row small.bad{color:#ff9d90}
.d-top{display:flex;justify-content:space-between;align-items:center}.d-state{font-style:normal;font-size:12.5px;color:var(--dim)}.d-state.ok{color:var(--ok)}.d-state.bad{color:var(--bad)}
.d-slide{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font:700 13px var(--num)}.d-slide input{width:100%;min-width:0;accent-color:var(--brass)}
.d-line{display:flex;gap:4px;align-items:center;justify-content:space-between;font-size:13px}.d-barter button{flex:1;padding:4px 2px;font-size:12.5px}
.k-game .d-apply{background:var(--brass);color:#16110a;font-weight:600;border:0;padding:6px}.k-game .d-apply:disabled{background:var(--panel2);color:var(--dim);cursor:default}
.k-set{z-index:14;background:rgba(8,12,22,.8);justify-content:center}
.s-panel{box-sizing:border-box;width:min(100%,680px);align-self:flex-start;background:var(--panel);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;min-height:100%}
.s-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-14px;background:var(--panel);padding-block:4px;z-index:1}.s-head h2{margin:0;font:400 28px var(--display);color:var(--brass)}
.s-note{margin:0;font-size:13px;line-height:1.5;color:var(--dim)}
.s-presets{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.s-presets span{font-size:13px;color:var(--dim)}
.s-panel section{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px}.s-panel h3{margin:0;font-size:12px;letter-spacing:.14em;color:var(--brass);font-weight:600}
.s-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,190px) 76px;gap:10px;align-items:center}.s-row label{display:grid;min-width:0;gap:1px}.s-row b{font-weight:600}.s-row small{font-size:12.5px;color:var(--dim)}.s-row.off{opacity:.55}
.s-row input[type=range]{width:100%;min-width:0;accent-color:var(--brass)}.s-row input[type=checkbox]{justify-self:start;width:20px;height:20px;accent-color:var(--brass)}.s-row output{text-align:right;font:700 14px var(--num);font-variant-numeric:tabular-nums}
.s-foot{padding-block:6px}
@media (max-width:520px){.s-row{grid-template-columns:minmax(0,1fr) 76px}.s-row label{grid-column:1/-1}}
.k-msg.warn{border-color:var(--bad);color:#ffd5cf}.k-msg.ok{border-color:var(--ok)}
.k-tribe{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));z-index:3;width:min(250px,46%);background:rgba(16,21,31,.9);border:1px solid #4f8a3c;border-left:3px solid #7bd65a;padding:6px 9px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.k-tribe[hidden]{display:none}.k-tribe .tr-top{display:flex;align-items:center;gap:8px}.k-tribe .tr-top b{color:#d9f7c6}.k-tribe .tr-top em{font-style:normal;font-size:12px;padding:0 6px;border:1px solid var(--line)}
.k-tribe .tr-ally{color:var(--ok);border-color:var(--ok)!important}.k-tribe .tr-hostile{color:var(--bad);border-color:var(--bad)!important}.k-tribe .tr-neutral{color:#e6f7c6}.k-tribe .tr-gone{color:var(--dim)}
.k-tribe button{margin-left:auto;padding:1px 7px;font-size:12px}.k-tribe .tr-pt{margin:2px 0 0}
.k-tribe .tr-m{border-top:1px solid var(--line);padding-top:4px}.k-tribe .tr-h{display:flex;justify-content:space-between;font-weight:600}.k-tribe .tr-m.ok .tr-h{color:var(--ok)}.k-tribe .tr-m.bad .tr-h{color:var(--bad)}
.k-tribe p{margin:1px 0 3px;color:var(--dim);font-size:12px;line-height:1.35}.k-tribe i{display:block;height:5px;background:#0a0f18}.k-tribe s{display:block;height:100%;background:#7bd65a;text-decoration:none}.k-tribe small{font:12px var(--num);color:var(--dim)}
.k-game.demo .k-tribe{display:none}
.k-mode{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:var(--brass);color:#16110a;font-weight:600;padding:4px 12px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.k-paused{position:absolute;inset:0;display:grid;place-items:center;font:400 44px var(--display);letter-spacing:.06em;background:rgba(8,12,22,.45);pointer-events:none}
.k-bottom{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;background:var(--panel);border-top:2px solid var(--brass);padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));min-height:176px}
.k-mapbox{width:160px;height:160px;background:#0a0f18;border:1px solid var(--line)}
#k-mini{width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.k-info{min-width:0;overflow:hidden;background:var(--ink);border:1px solid var(--line);padding:10px;clip-path:var(--cut)}
.k-empty{margin:0;color:var(--dim)}
.k-one{display:flex;gap:12px;align-items:flex-start}
.k-one img{width:76px;height:76px;background:var(--panel);border:1px solid var(--line)}
.k-one>div{min-width:0;flex:1}
.k-one h3{margin:0 0 2px;font:400 21px var(--display);letter-spacing:.02em}
.k-hp{margin:0;font:700 15px var(--num);color:var(--ok)}
.k-st{margin:2px 0 0;color:var(--dim)}
.k-prod{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.k-prod i{flex:1;min-width:70px;height:7px;background:var(--panel2);display:block}.k-prod s{display:block;height:100%;background:var(--brass)}
.k-many{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:3px;max-height:136px;overflow:auto}
.k-many button{padding:0;position:relative;aspect-ratio:1;background:var(--panel)!important;min-width:0}
.k-many img{width:100%;height:100%;display:block}.k-many i{position:absolute;left:0;bottom:0;height:3px}
.k-card{display:grid;grid-template-columns:repeat(4,58px);grid-auto-rows:50px;gap:4px;align-content:start;min-width:244px}
.k-cmd{position:relative;padding:0!important;display:grid;place-items:center;overflow:hidden;clip-path:var(--cut)}
.k-cmd img{width:42px;height:42px}
.k-cmd em{font-style:normal;font-weight:600;font-size:14px}
.k-cmd kbd{position:absolute;right:3px;top:1px;font:700 11px var(--num);color:var(--brass)}
.k-cmd u{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,12,22,.75);text-decoration:none;font:700 17px var(--num)}
.k-cmd.off{opacity:.42}.k-cmd.poor img,.k-cmd.poor em{opacity:.5}
.k-tip{position:absolute;z-index:6;max-width:250px;background:var(--ink);border:1px solid var(--brass);padding:8px 10px;pointer-events:none;font-size:13px}
.k-tip b{font-size:14px}.k-tip p{margin:3px 0 0;color:var(--dim)}.k-tip .why{color:#ffb3a8}
.k-tip{max-width:300px;line-height:1.45}.k-htip{max-width:320px;z-index:7}
.k-tip .t-kind{display:block;color:var(--brass);font-size:12px;margin-top:1px}
.k-tip table{border-collapse:collapse;margin-top:5px;width:100%}.k-tip th{text-align:left;font-weight:600;color:var(--dim);padding:1px 8px 1px 0;white-space:nowrap;vertical-align:top}.k-tip td{padding:1px 0;color:var(--text)}
.k-tip .c-ore{color:var(--ore)}.k-tip .c-gas{color:var(--gas)}.k-tip .ok{color:var(--ok)}.k-tip .no{color:#ffb3a8}
.k-tip .t-h{margin:6px 0 1px;color:var(--brass);font-size:12px}.k-tip ul{margin:0;padding:0;list-style:none}.k-tip li{padding:1px 0;color:var(--text)}.k-tip li.no{color:#c99}.k-tip li.done{color:var(--dim)}.k-tip li em{font-style:normal;color:#ffb3a8;font-size:12px}.k-tip li.done em{color:var(--ok)}
.k-tip kbd{display:inline-block;min-width:16px;text-align:center;font:700 11px var(--num);border:1px solid var(--line);padding:0 3px;margin-right:5px;color:var(--brass)}
.c-ore{color:var(--ore)}.c-gas{color:var(--gas)}
.k-overlay{position:absolute;inset:0;z-index:10;display:flex;overflow:auto}
.k-start{background:linear-gradient(90deg,rgba(10,15,24,.9) 0,rgba(10,15,24,.72) 430px,rgba(10,15,24,.04) 620px)}
.k-end{background:rgba(8,12,22,.74);justify-content:center;align-items:center}
.k-game.demo{grid-template-rows:minmax(0,1fr)}
.k-game.demo .k-top,.k-game.demo .k-bottom{display:none}
.k-panel{width:min(100%,480px);padding-block:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:9px;margin-block:auto}
.k-panel h1{margin:0;font:400 clamp(46px,8vw,70px)/1 var(--display);color:var(--brass);letter-spacing:.015em;text-wrap:balance}
.k-sub{margin:0 0 4px;line-height:1.6;color:var(--text);max-width:62ch}
.k-panel h2{margin:6px 0 0;font:600 12px var(--body);letter-spacing:.14em;color:var(--dim)}
.k-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.k-three{grid-template-columns:repeat(3,1fr)}
.k-game .k-opt{text-align:left;padding:8px 10px;background:rgba(27,36,51,.86);display:flex;flex-direction:column;gap:3px;min-width:0}
.k-opt b{font-size:15px}.k-opt span{font-size:12.5px;line-height:1.4;color:var(--dim)}
.k-game .k-opt.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);background:#33301f}
#k-opt-beginner{grid-column:1/-1}
.k-go{display:flex;gap:8px;margin-top:6px}
.k-game .k-primary{background:var(--brass);color:#16110a;border:0;font:400 23px var(--display);padding:10px 34px;clip-path:var(--cut)}
.k-go button:not(.k-primary){padding:8px 16px}
.k-wait{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:6px 14px;background:rgba(27,36,51,.92);border:1px solid var(--warn);color:var(--warn);font-size:14px;pointer-events:none;z-index:3}
.k-in{font:inherit;font-size:16px;color:var(--text);background:var(--panel2);border:1px solid var(--line);padding:8px 10px;min-width:0}
.k-in:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.k-netjoin{display:flex;gap:6px}.k-netjoin .k-in{flex:1;letter-spacing:.2em}
.k-code{font:700 64px/1 var(--num);letter-spacing:.18em;color:var(--brass);padding:8px 0}
.k-netst{margin:2px 0;color:var(--dim);font-size:14px}.k-netst.bad{color:var(--bad)}
.k-away{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,400px);padding:14px 16px;background:rgba(16,22,34,.96);border:1px solid var(--warn);z-index:5;font-size:14px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.k-away b{color:var(--warn);font-size:16px}.k-away p{margin:6px 0;color:var(--text);line-height:1.45}.k-away .k-small{color:var(--dim);font-size:12px}.k-away .k-go{justify-content:center;margin-top:10px}
.k-pop{position:absolute;z-index:8;min-width:190px;max-width:270px;background:rgba(14,19,30,.97);border:1px solid var(--brass);padding:6px;box-shadow:0 6px 22px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:5px}
.k-pop h3{margin:2px 4px 3px;font-size:14px;color:var(--brass)}
.k-pop button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:8px 10px;min-height:44px;font-size:15px;border:1px solid var(--line);color:var(--text)}
.k-pop button b{font-weight:700}.k-pop button small{font-size:12px;color:var(--dim)}.k-pop button small.why{color:#ffb3a8}.k-pop button.off{opacity:.72}.k-pop button.poor .k-popc{color:var(--bad)}
.k-pop .k-popc{font-size:12px}.k-pop .c-ore{color:var(--ore)}.k-pop .c-gas{color:var(--gas)}
.k-lv{font-size:12px;color:#ffd25a;font-weight:600}
.k-four{grid-template-columns:repeat(2,1fr)}
.k-small{font-size:12.5px;color:var(--dim)}
.k-netsum{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:4px 0}.k-netsum dt{color:var(--dim)}.k-netsum dd{margin:0}
.k-netp{display:flex;flex-direction:column;gap:9px}
.k-game .k-primary:disabled{opacity:.4;cursor:not-allowed}
.k-netchat{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:6px}.k-netchat .k-go{margin-top:0}
.k-ver{margin:6px 0 0;font:12px var(--num);color:var(--dim)}
.k-chatlog{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;z-index:6;width:min(78%,360px);display:flex;flex-direction:column;gap:3px;pointer-events:none}
.k-chatlog p{margin:0;background:rgba(16,21,31,.86);padding:4px 10px;font-size:14px;line-height:1.4;border-left:3px solid var(--line);overflow-wrap:anywhere}
.k-chatlog p b{margin-right:8px;font-weight:600}.k-chatlog p.me b{color:#7fd0ff}.k-chatlog p.peer b{color:#ffab8a}.k-chatlog p.peer{border-left-color:#ff8a5a}.k-chatlog p.me{border-left-color:#46c4ff}
.k-chatbox:not([hidden])~.k-chatlog,.k-stage:has(.k-chatbox:not([hidden])) .k-chatlog{bottom:96px}
.k-chatlog.lobby{position:static;width:auto;max-height:150px;min-height:40px;overflow:auto;pointer-events:auto;background:rgba(16,21,31,.6);padding:4px}
.k-chatlog.lobby p{background:none;padding:2px 6px}
.k-chatbox{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:7;width:min(94%,520px);display:flex;flex-direction:column;gap:6px;background:rgba(16,21,31,.94);border:1px solid var(--brass);padding:8px}
.k-chatrow{display:flex;gap:6px}.k-chatrow .k-in{flex:1}
.k-quick{display:flex;flex-wrap:wrap;gap:5px}.k-game .k-quick button{padding:5px 10px;font-size:13.5px}
.k-help{color:var(--dim);font-size:13px}.k-help summary{cursor:pointer;padding:4px 0}

#k-stats{border-collapse:collapse;font-family:var(--num);font-variant-numeric:tabular-nums;width:100%}
#k-stats th{font:400 14px var(--body);text-align:left;color:var(--dim)}#k-stats td{text-align:right;padding:4px 0 4px 18px}

.k-end .k-panel{background:var(--panel);border:1px solid var(--brass);padding:24px;width:min(92%,420px)}
/* 금속 콘솔 질감: 위아래 조작부에 빛 반사와 그늘, 버튼은 눌리는 느낌 */
.k-top{background:linear-gradient(180deg,#2c374b 0%,#1a2231 55%,#141b27 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 3px 12px rgba(0,0,0,.55);position:relative;z-index:2}
.k-bottom{background:linear-gradient(180deg,#2a3549 0%,#1a2231 18%,#131a26 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.07),0 -4px 16px rgba(0,0,0,.6);position:relative;z-index:2}
.k-bottom::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px)}

}

<body>
<div id="kr-app"></div>
<script>(globalThis.RTS = globalThis.RTS || {}).BUILD = '9000d1f';
// ─────────────────────────────────────────────────────────────
// core.js — 네임스페이스, 데이터 레지스트리, 모드 API, 난수, 게임 생성
// 규칙: engine/ 폴더는 DOM을 쓰지 않는다. Node에서도 그대로 돌아간다.
// 좌표 단위는 타일(float). 시뮬레이션은 20틱/초 고정이며 결정적이다.
// ─────────────────────────────────────────────────────────────
const RTS = (globalThis.RTS = globalThis.RTS || {});
RTS.version = '0.1.0';
RTS.HZ = 20;
RTS.defs = { terrain: {}, entities: {}, upgrades: {}, abilities: {}, factions: {}, maps: {}, mapgens: {}, difficulties: {}, companies: {}, marketEvents: {}, branches: {}, tribeMissions: {}, merges: {} };
RTS.TRIBE = -2;       // 잿빛 부족(AI 중립 세력)의 팀 번호. -1은 자원·거점 같은 비활성 중립
RTS.orders = {};      // 유닛 명령 핸들러: RTS.orders.move = (G,u,o)=>...
RTS.systems = [];     // 틱 파이프라인: [{id, run(G)}]
RTS.commands = {};    // 플레이어 입력 처리기: RTS.commands.train = (G,team,cmd)=>...

// 콘텐츠 추가는 전부 이 함수 하나로 한다. 같은 id는 덮어쓴다.
RTS.mod = function (pack) {
  for (const k of Object.keys(pack)) {
    if (!RTS.defs[k]) throw new Error('알 수 없는 콘텐츠 종류: ' + k);
    for (const id of Object.keys(pack[k])) RTS.defs[k][id] = Object.assign({ id }, pack[k][id]);
  }
  RTS._prod = null; // 유닛→생산 건물 캐시(upgrade.js)
};
// 기존 정의 일부만 수정: RTS.patch('entities','p_rifle',{hp:60})
RTS.patch = (kind, id, change) => Object.assign(RTS.defs[kind][id], change);
// 시스템 삽입: RTS.addSystem({id:'weather',run}, {before:'movement'})
RTS.addSystem = function (sys, pos = {}) {
  const ref = pos.before || pos.after;
  const i = ref ? RTS.systems.findIndex(s => s.id === ref) : -1;
  if (i < 0) RTS.systems.push(sys); else RTS.systems.splice(pos.before ? i : i + 1, 0, sys);
};

RTS.rand = G => { // mulberry32. 상태가 G.rng에 있어 저장/리플레이가 재현된다.
  G.rng = (G.rng + 0x6D2B79F5) | 0;
  let t = G.rng; t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

RTS.on = (G, type, fn) => { (G._ls[type] = G._ls[type] || []).push(fn); };
RTS.emit = (G, type, data) => { (G._ls[type] || []).forEach(f => f(data, G)); };

// 설정값. 옛 저장 파일에 없는 항목은 기본값으로 채운다.
RTS.cfg = G => G.cfg || (G.cfg = RTS.defaultSettings());
RTS.createGame = function (opts) {
  // opts: {map, seed, players:[{faction, ai:null|'easy'|'normal'|'hard', name}]}
  const G = { tick: 0, rng: (opts.seed || 1) | 0, nextId: 1, ents: [], byId: {}, teams: [], cmds: [], projectiles: [],
    over: null, mapId: opts.map, seed: opts.seed || 1, cfg: Object.assign(RTS.defaultSettings(), opts.settings), _ls: {} };
  const easy = opts.players.map(p => p.ai && RTS.defs.difficulties[p.ai]).find(d => d && d.reveal);
  G.coop = !!opts.coop; // 둘이 협동: 사람 둘(편 0)이 동맹해 중립세력 AI(편 1)와 싸운다
  G.nofog = !!opts.nofog || !G.cfg.fog || !!easy;
  const spec = RTS.defs.maps[opts.map];
  const m = RTS.defs.mapgens[spec.gen](spec, G);
  G.w = m.w; G.h = m.h; G.tiles = m.tiles; G.bases = m.bases; G.siteSpots = m.sites || []; G.postSpots = m.posts || []; G.tribeSpot = m.tribe || null;
  RTS.initRuntime(G);
  opts.players.forEach((p, i) => {
    const size = G.w * G.h;
    const t = { id: i, faction: p.faction, ai: p.ai || null, name: p.name || RTS.defs.factions[p.faction].name,
      res: { ore: G.cfg.startOre, gas: G.cfg.startGas }, sup: 0, cap: 0, have: {}, upgrades: {}, research: {}, inc: 1, mods: {}, aiState: {},
      stats: { kills: 0, lost: 0, ore: 0, gas: 0, made: 0 }, vis: new Array(size).fill(0), seen: new Array(size).fill(0) };
    if (p.side !== undefined) t.side = p.side; // 같은 편끼리는 동맹(RTS.ally)
    if (p.ai) { t.boost = p.boost || 1; t.inc = RTS.defs.difficulties[p.ai].income * t.boost; } // boost: 중립세력 AI 성능 배율
    const hc = p.hc && RTS.HANDICAPS && RTS.HANDICAPS[p.hc]; // 2인 대전 팀별 핸디캡
    if (hc && hc.id !== 'none') { t.hc = hc.id; t.res.ore += hc.ore || 0; t.res.gas += hc.gas || 0; t.inc *= hc.income || 1; if (hc.reveal) t.reveal = true; }
    G.teams.push(t);
  });
  m.nodes.forEach(n => {
    const e = RTS.spawn(G, n.def, -1, n.tx + RTS.defs.entities[n.def].size[0] / 2, n.ty + RTS.defs.entities[n.def].size[1] / 2);
    e.amount = RTS.defs.entities[n.def].amount;
  });
  const starts = G.bases.filter(b => b.start !== undefined), spots = G.coop ? RTS.coopBases(G) : G.teams.length > 2 ? RTS.ffaBases(G) : null;
  G.teams.forEach((t, i) => {
    const b = spots ? spots[i] : starts.find(s => s.start === i), f = RTS.defs.factions[t.faction];
    b.owner = i;
    const hs = RTS.defs.entities[f.hq].size, hq = RTS.spawn(G, f.hq, i, Math.round(b.x - hs[0] / 2) + hs[0] / 2, Math.round(b.y - hs[1] / 2) + hs[1] / 2); hq.built = hq.buildT; hq.hp = RTS.stat(G, hq, 'hp');
    const ore = RTS.nearestNode(G, b.x, b.y, 'ore', 30);
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * Math.PI * 2;
      const w = RTS.spawn(G, f.worker, i, b.x + Math.cos(a) * 3, b.y + Math.sin(a) * 3);
      RTS.issue(G, w, { type: 'gather', node: ore.id });
    }
  });
  if (easy && easy.towers) G.teams.forEach(t => { if (!t.ai) RTS.giveTowers(G, t, easy.towers); });
  G.teams.forEach(t => { const hc = t.hc && RTS.HANDICAPS[t.hc]; if (hc && hc.towers) RTS.giveTowers(G, t, hc.towers); });
  RTS.initMarket(G); RTS.initDip(G); if (RTS.initTribe) RTS.initTribe(G); RTS.initWar(G); RTS.census(G); RTS.updateFog(G, true);
  return G;
};

// 협동 시작 위치: 0번 사람 = 시작 기지 0, 중립세력(2번) = 맞은편 시작 기지 1,
// 1번 사람 = 시작 기지 0에서 가장 가까운 확장 기지(광맥 있는 곳). 두 사람이 같은 쪽에서 함께 막는다.
RTS.coopBases = function (G) {
  const s0 = G.bases.find(b => b.start === 0), s1 = G.bases.find(b => b.start === 1);
  const rest = G.bases.filter(b => b.start === undefined && RTS.nearestNode(G, b.x, b.y, 'ore', 12));
  rest.sort((a, b) => Math.hypot(a.x - s0.x, a.y - s0.y) - Math.hypot(b.x - s0.x, b.y - s0.y));
  return [s0, rest[0], s1];
};
// 셋이 서로 싸울 때: 0·1번은 시작 기지, 2번(중립세력)은 두 시작 기지와의 거리 차이가 가장 작은 확장 기지.
// 대칭 맵에서는 같은 점수의 기지가 짝으로 나오므로 그중 무작위로 고른다(평균적으로 공평).
RTS.ffaBases = function (G) {
  const s0 = G.bases.find(b => b.start === 0), s1 = G.bases.find(b => b.start === 1), d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const rest = G.bases.filter(b => b.start === undefined && RTS.nearestNode(G, b.x, b.y, 'ore', 12)).map(b => ({ b, k: Math.round(Math.abs(d(b, s0) - d(b, s1))) }));
  const best = Math.min(...rest.map(r => r.k)), pick = rest.filter(r => r.k === best);
  return [s0, s1, pick[Math.floor(RTS.rand(G) * pick.length)].b];
};
// 같은 편이면 동맹. 편(side)이 없는 일반 게임에서는 자기 팀만 해당한다.
RTS.ally = (G, a, b) => { if (a === b) return true; if (a < 0 || b < 0) return false; const x = G.teams[a], y = G.teams[b]; return !!(x && y && x.side !== undefined && x.side === y.side); };
RTS.allyTeams = (G, a) => G.teams.filter(t => t.id !== a && RTS.ally(G, a, t.id));

// 왕초보: 본진 둘레에 완공된 방어탑을 [최소,최대] 사이 무작위 개수만큼 세운다.
// 적이 올 방향(맵 중앙 쪽)부터 채우고, 광맥·분출구 근처와 사령부→광맥 일꾼 동선은 비워 둔다.
RTS.giveTowers = function (G, t, range) {
  const f = RTS.defs.factions[t.faction], id = f.defense; if (!id) return 0;
  const d = RTS.defs.entities[id], hq = G.ents.find(e => e.team === t.id && e.def === f.hq); if (!hq) return 0;
  const want = range[0] + Math.floor(RTS.rand(G) * (range[1] - range[0] + 1));
  const ore = RTS.nearestNode(G, hq.x, hq.y, 'ore', 30), base = Math.atan2(G.h / 2 - hq.y, G.w / 2 - hq.x) + (RTS.rand(G) - .5) * .8; // 맵 중앙(적 방향)부터 채운다
  const segD = (px, py) => { if (!ore) return 99; const ax = ore.x - hq.x, ay = ore.y - hq.y, L = ax * ax + ay * ay || 1, k = Math.max(0, Math.min(1, ((px - hq.x) * ax + (py - hq.y) * ay) / L)); return Math.hypot(px - hq.x - ax * k, py - hq.y - ay * k); };
  let n = 0;
  for (let r = 5; r <= 16 && n < want; r += 1) for (let k = 0; k < 32 && n < want; k++) {
    const a = base + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * Math.PI * 2 / 32, cx = hq.x + Math.cos(a) * r, cy = hq.y + Math.sin(a) * r;
    const tx = Math.round(cx - d.size[0] / 2), ty = Math.round(cy - d.size[1] / 2), mx = tx + d.size[0] / 2, my = ty + d.size[1] / 2;
    if (!RTS.canPlace(G, t.id, id, tx, ty, 1)) continue;
    if (RTS.nearestNode(G, mx, my, 'ore', 4) || RTS.nearestNode(G, mx, my, 'gas', 4) || segD(mx, my) < 3) continue;
    if (G.ents.some(e => e.def === id && e.team === t.id && Math.hypot(e.x - mx, e.y - my) < 3.5)) continue;
    const e = RTS.spawn(G, id, t.id, mx, my); e.built = e.buildT; e.hp = RTS.stat(G, e, 'hp'); n++;
  }
  return n;
};

RTS.initRuntime = function (G) {
  G._occ = new Int32Array(G.w * G.h);
  G._cols = Math.ceil(G.w / 4); G._rows = Math.ceil(G.h / 4);
  G._grid = Array.from({ length: G._cols * G._rows }, () => []);
  G._pathQ = 0;
};

RTS.step = function (G) {
  if (G.over) return;
  G.tick++;
  for (const s of RTS.systems) s.run(G);
};

// 저장은 '_' 로 시작하지 않는 모든 필드를 JSON으로 직렬화한다.
RTS.serialize = G => JSON.stringify(G, (k, v) => (k[0] === '_' ? undefined : v));
RTS.deserialize = function (json) {
  const G = JSON.parse(json); G._ls = {}; G.cfg = Object.assign(RTS.defaultSettings(), G.cfg); RTS.initRuntime(G);
  G.byId = {}; for (const e of G.ents) { G.byId[e.id] = e; const d = RTS.defs.entities[e.def]; if (d.size) RTS.occupy(G, e, e.id); }
  return G;
};

// map.js — 타일, 점유, 경로탐색(A*), 시야선, 공간 해시, 시야(안개), 기본 맵 생성기
RTS.tile = (G, x, y) => (x < 0 || y < 0 || x >= G.w || y >= G.h ? 1 : G.tiles[y * G.w + x]);
RTS.walkable = (G, x, y) => {
  if (x < 0 || y < 0 || x >= G.w || y >= G.h) return false;
  const i = y * G.w + x;
  return RTS.terrainPass[G.tiles[i]] && !G._occ[i];
};
RTS.terrainPass = [true, false, true]; // 0 땅, 1 암벽, 2 모래. 맵 생성 후 defs.terrain이 덮어씀

RTS.rectOf = e => { const s = RTS.defs.entities[e.def].size; return { x0: e.x - s[0] / 2, y0: e.y - s[1] / 2, w: s[0], h: s[1] }; };
RTS.occupy = function (G, e, val) {
  const r = RTS.rectOf(e);
  for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
    const tx = Math.round(r.x0) + x, ty = Math.round(r.y0) + y;
    if (tx >= 0 && ty >= 0 && tx < G.w && ty < G.h) G._occ[ty * G.w + tx] = val;
  }
};

// 가장 가까운 통행 가능 타일 (나선 탐색)
RTS.nearestFree = function (G, x, y, maxR = 12) {
  const cx = Math.floor(x), cy = Math.floor(y);
  if (RTS.walkable(G, cx, cy)) return { x, y };
  for (let r = 1; r <= maxR; r++) {
    let best = null, bd = 1e9;
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r || !RTS.walkable(G, cx + dx, cy + dy)) continue;
      const d = (cx + dx + .5 - x) ** 2 + (cy + dy + .5 - y) ** 2;
      if (d < bd) { bd = d; best = { x: cx + dx + .5, y: cy + dy + .5 }; }
    }
    if (best) return best;
  }
  return { x, y };
};

RTS.lineClear = function (G, x0, y0, x1, y1, r = .32) {
  const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
  if (len < .01) return true;
  const n = Math.ceil(len / .25), px = -dy / len * r, py = dx / len * r;
  for (let i = 1; i <= n; i++) {
    const x = x0 + dx * i / n, y = y0 + dy * i / n;
    if (!RTS.walkable(G, Math.floor(x + px), Math.floor(y + py)) || !RTS.walkable(G, Math.floor(x - px), Math.floor(y - py))) return false;
  }
  return true;
};

// 이진 힙 A*. goal = {x,y} 또는 {x0,y0,x1,y1} 타일 사각형
const AS = { size: 0 };
function asInit(n) { if (AS.size === n) return; AS.size = n; AS.g = new Float32Array(n); AS.from = new Int32Array(n); AS.stamp = new Int32Array(n); AS.closed = new Int32Array(n); AS.gen = 0; }
RTS.findPath = function (G, sx, sy, goal) {
  const w = G.w, n = w * G.h; asInit(n);
  const gen = ++AS.gen, start = Math.floor(sy) * w + Math.floor(sx);
  const rect = goal.x0 !== undefined;
  const gx = rect ? (goal.x0 + goal.x1) / 2 : Math.floor(goal.x), gy = rect ? (goal.y0 + goal.y1) / 2 : Math.floor(goal.y);
  const H = (x, y) => { const a = Math.abs(x - gx), b = Math.abs(y - gy); return (a + b) + (1.414 - 2) * Math.min(a, b); };
  const isGoal = (x, y) => rect ? (x >= goal.x0 && x <= goal.x1 && y >= goal.y0 && y <= goal.y1) : (x === gx && y === gy);
  const heap = [], f = []; // 힙은 노드 인덱스, f는 우선순위
  const push = (i, p) => { let c = heap.length; heap.push(i); f.push(p);
    while (c > 0) { const q = (c - 1) >> 1; if (f[q] <= f[c]) break; [heap[q], heap[c]] = [heap[c], heap[q]]; [f[q], f[c]] = [f[c], f[q]]; c = q; } };
  const pop = () => { const top = heap[0], li = heap.pop(), lf = f.pop();
    if (heap.length) { heap[0] = li; f[0] = lf; let c = 0;
      for (;;) { const l = 2 * c + 1, r = l + 1; let m = c; if (l < heap.length && f[l] < f[m]) m = l; if (r < heap.length && f[r] < f[m]) m = r; if (m === c) break;
        [heap[m], heap[c]] = [heap[c], heap[m]]; [f[m], f[c]] = [f[c], f[m]]; c = m; } }
    return top; };
  AS.g[start] = 0; AS.stamp[start] = gen; AS.from[start] = -1; push(start, 0);
  let best = start, bestH = 1e9, found = -1, visited = 0;
  const DX = [1, -1, 0, 0, 1, 1, -1, -1], DY = [0, 0, 1, -1, 1, -1, 1, -1];
  while (heap.length && visited < 7000) {

// 기본 맵 생성기: 데이터(암벽 원/선, 기지 위치)만 받아 180도 회전 대칭으로 찍는다.

  for (const [a, b, c, d, t] of spec.lanes || []) line(a, b, c, d, t, 0);

  for (const t of G.teams) t.cap = Math.min(t.cap + RTS.allyPerk(G, t.id, 'supply'), RTS.cfg(G).supplyCap);
};
RTS.systems.push(
  { id: 'commands', run(G) { const q = G.cmds; G.cmds = []; for (const c of q) (RTS.commands[c.type] || (() => {}))(G, c.team, c); } },
  { id: 'census', run: G => RTS.census(G) },
  { id: 'ai', run(G) { for (const t of G.teams) if (t.ai) RTS.aiThink(G, t); } },
  { id: 'regen', run(G) { // 진영 regen: 1초마다 완공 건물과 유닛의 체력을 회복한다(포자군락)
    if (G.tick % RTS.HZ) return; const R = G.teams.map(t => RTS.defs.factions[t.faction].regen || 0); if (!R.some(Boolean)) return;
    for (const e of G.ents) { if (e.dead || e.team < 0 || !R[e.team] || (e.buildT && e.built < e.buildT)) continue; const m = RTS.stat(G, e, 'hp'); if (e.hp < m) e.hp = Math.min(m, e.hp + R[e.team]); } } },
  { id: 'entities', run(G) {
    for (const e of G.ents) {
      if (e.dead) continue;
      const d = defOf(e); if (d.kind === 'resource') continue;
      if (e.buffs.length) e.buffs = e.buffs.filter(b => b.until > G.tick);
      if (d.site) continue; // 거점 상태는 market 시스템이 관리한다
      if (d.kind === 'building') { runBuilding(G, e); continue; }
      if (e.cd > 0) e.cd--;
      if (e.stunned > G.tick) continue;
      if (d.regen && G.tick % RTS.HZ === 0) e.hp = Math.min(RTS.stat(G, e, 'hp'), e.hp + d.regen);
      if (e.order) RTS.orders[e.order.type](G, e, e.order);
      else if (!d.passive) { if (tryHeal(G, e, true)) continue;
        if (e.sieged || d.immobile) { const t = autoTarget(G, e); if (t) engage(G, e, t, false); continue; }
        const t = autoTarget(G, e); if (t) e.order = { type: 'amove', x: e.x, y: e.y }; }
    }
  } },
  { id: 'movement', run: moveUnits },
  { id: 'projectiles', run(G) {
    G.projectiles = G.projectiles.filter(p => {
      const t = G.byId[p.target]; if (t && !t.dead) { p.tx = t.x; p.ty = t.y; }
      const d = Math.hypot(p.tx - p.x, p.ty - p.y), step = p.speed / RTS.HZ;
      if (d > step) { p.x += (p.tx - p.x) / d * step; p.y += (p.ty - p.y) / d * step; return true; }
      const de = D()[p.wdef], w = (p.sieged && de.siegeWeapon) || de.weapon;
      RTS.hit(G, t, p.tx, p.ty, p.dmg, w, G.byId[p.src] || { team: p.team, dead: true });
      return false;
    });
  } },
  { id: 'cleanup', run(G) {
    if (G.ents.some(e => e.dead)) { G.ents = G.ents.filter(e => { if (e.dead) delete G.byId[e.id]; return !e.dead; }); }
  } },
  { id: 'fog', run: G => RTS.updateFog(G) },
  { id: 'victory', run(G) {
    if (G.tick % 10) return;
    RTS.census(G);
    const live = G.teams.filter(t => t.alive > 0);
    if (G.coop) { // 협동: 편 단위로 판정. 사람 둘 중 하나만 남아도 계속한다
      const sides = [...new Set(live.map(t => t.side))];
      if (sides.length <= 1) { G.over = { winner: live[0] ? live[0].id : -1, side: sides.length ? sides[0] : -1, tick: G.tick }; RTS.emit(G, 'gameover', G.over); }
      return;
    }
    if (live.length <= 1) { G.over = { winner: live[0] ? live[0].id : -1, tick: G.tick }; RTS.emit(G, 'gameover', G.over); }
  } },
);

// upgrade.js — 건물 강화(1·2단계), 유닛 강화(★), 유닛 합체. DOM을 쓰지 않는다.
//  - 건물 강화: 건물마다 따로. 체력·방어·생산(연구) 속도·공격·보급이 오른다. 생산 대기열에 들어가 시간이 걸린다.
//  - 유닛 강화: 유닛마다 따로, 즉시. ★n은 그 유닛을 만드는 건물이 강화 n단계 이상이어야 한다.
//  - 합체: 합체 건물(merges[].at)이 강화 2단계면 재료 유닛을 모아 새 유닛 하나로 바꾼다.
//    체력 = 재료 체력 합, 공격력(초당 피해) = 재료 합 × 0.75 → 두 기 합체면 한 기 기준 1.5배.
RTS.LEVEL = { max: 2, hp: .25, armor: 1, rate: .25, dmg: .25, range: .5, supply: 4,
  cost: [.6, 1], oreMin: [75, 150], gasMin: [50, 100], time: [.6, 1], timeMin: [20, 30] };
RTS.RANK = { max: 2, hp: .2, dmg: .15, cost: [.4, .6] };
RTS.MERGE = { range: 10, dmg: .75, wait: 20 }; // range: 재료를 찾는 거리(칸), wait: 모이는 제한 시간(초)

const r25 = v => Math.round(v / 25) * 25, r5 = v => Math.round(v / 5) * 5;

// ── 건물 강화 ──────────────────────────────────────────────
RTS.canLevel = d => !!d && d.kind === 'building' && !d.site && !d.placeOn && !d.noLevel && !!d.cost;
RTS.levelCost = (d, lv) => { const L = RTS.LEVEL, k = lv - 1, c = d.cost || {}; return { ore: Math.max(L.oreMin[k], r25((c.ore || 0) * L.cost[k])), gas: Math.max(L.gasMin[k], r25((c.gas || 0) * L.cost[k])) }; };
RTS.levelTime = (d, lv) => Math.max(RTS.LEVEL.timeMin[lv - 1], Math.round((d.time || 20) * RTS.LEVEL.time[lv - 1]));
RTS.prodRate = e => 1 + RTS.LEVEL.rate * (e.lv || 0);
RTS.provides = e => { const d = RTS.defOf(e); return d.provides ? d.provides + RTS.LEVEL.supply * (e.lv || 0) : 0; };
// 강화 n단계가 주는 효과(누적값) 설명
RTS.levelFx = (d, lv) => { const L = RTS.LEVEL, out = [`체력 +${Math.round(L.hp * lv * 100)}%`, `방어 +${L.armor * lv}`];
  if (d.trains || d.researches) out.push(`${d.researches && !d.trains ? '연구' : '생산'} 속도 +${Math.round(L.rate * lv * 100)}%`);
  if (d.weapon) out.push(`공격 +${Math.round(L.dmg * lv * 100)}%`, `사거리 +${L.range * lv}`);
  if (d.provides) out.push(`보급 +${L.supply * lv}`);
  return out; };
RTS.levelBlock = function (G, b) { const d = RTS.defOf(b);
  if (!RTS.canLevel(d) || b.team < 0) return '강화할 수 없는 건물입니다';
  if (!RTS.complete(b)) return '건설 중에는 강화할 수 없습니다';
  if ((b.lv || 0) >= RTS.LEVEL.max) return '이미 최고 단계입니다';
  if (b.prod.some(p => p.kind === 'level')) return '강화가 진행 중입니다';
  if (b.prod.length >= 5) return '대기열이 가득 찼습니다';
  return ''; };
RTS.commands.levelup = function (G, team, c) {
  const t = G.teams[team], b = G.byId[c.building]; if (!b || b.dead || b.team !== team) return;
  const why = RTS.levelBlock(G, b); if (why) { RTS.say(G, team, why, 'warn'); return; }
  const d = RTS.defOf(b), lv = (b.lv || 0) + 1, cost = RTS.levelCost(d, lv); if (RTS.lack(G, team, t, cost)) return;
  RTS.pay(t, cost); b.prod.push({ kind: 'level', id: b.def, lv, t: 0, total: Math.round(RTS.levelTime(d, lv) * RTS.HZ), started: true });
};
RTS.levelDone = function (G, b, lv) {
  const old = RTS.stat(G, b, 'hp'); b.lv = lv; b.hp = Math.min(RTS.stat(G, b, 'hp'), b.hp * RTS.stat(G, b, 'hp') / old);
  const unlock = Object.values(RTS.defs.merges).filter(m => m.at === b.def && lv >= 2).map(m => RTS.defs.entities[m.into].name);
  RTS.say(G, b.team, `${RTS.defOf(b).name} 강화 ${lv}단계 완료` + (unlock.length ? ` · 합체 가능: ${unlock.join(', ')}` : ''), 'ok');
  RTS.emit(G, 'leveled', { e: b, lv });
};

// ── 유닛 강화 ★ ────────────────────────────────────────────
// 유닛 → 그 유닛을 만드는 건물 id. 합체 유닛은 합체 건물.
RTS.producerOf = function (id) {
  if (!RTS._prod) { RTS._prod = {}; for (const b of Object.values(RTS.defs.entities)) for (const u of b.trains || []) if (!RTS._prod[u]) RTS._prod[u] = b.id;
    for (const m of Object.values(RTS.defs.merges)) RTS._prod[m.into] = m.at; }
  return RTS._prod[id] || null; };
RTS.rankCost = (d, r) => { const k = RTS.RANK.cost[r - 1], c = d.cost || {}, out = { ore: Math.max(25, r5((c.ore || 0) * k)) }; if (c.gas) out.gas = r5(c.gas * k); return out; };
RTS.rankBlock = function (G, u) { const d = RTS.defOf(u), t = G.teams[u.team];
  if (!t || d.kind !== 'unit' || d.uncontrollable) return '강화할 수 없습니다';
  const p = RTS.producerOf(u.def); if (!p) return '강화할 수 없는 유닛입니다';
  const r = (u.rank || 0) + 1; if (r > RTS.RANK.max) return '이미 최고 강화 단계입니다';
  if (((t.lvl || {})[p] || 0) < r) return `${RTS.defs.entities[p].name} 강화 ${r}단계가 필요합니다`;
  return ''; };
RTS.commands.rankup = function (G, team, c) {
  const t = G.teams[team]; let n = 0, why = '';
  for (const id of c.ids || []) { const u = G.byId[id]; if (!u || u.dead || u.team !== team) continue;
    const no = RTS.rankBlock(G, u); if (no) { why = why || no; continue; }
    const r = (u.rank || 0) + 1, cost = RTS.rankCost(RTS.defOf(u), r); if (RTS.lack(G, team, t, cost)) { why = ''; break; } // lack이 부족 알림을 낸다
    RTS.pay(t, cost); const old = RTS.stat(G, u, 'hp'); u.rank = r; u.hp = Math.min(RTS.stat(G, u, 'hp'), u.hp * RTS.stat(G, u, 'hp') / old); n++;
    RTS.emit(G, 'ranked', { e: u });
  }
  if (n) RTS.say(G, team, `강화 완료 ${n}기`, 'ok'); else if (why) RTS.say(G, team, why, 'warn');
};

// ── 합체 ──────────────────────────────────────────────────
// 재료 정의로 합체 유닛 스탯을 만든다. extra로 이름·그림·크기·능력 등을 덧붙인다.
//  체력 합, 방어·시야·사거리 최대, 속도 최소(가장 느린 재료), 보급·비용 합.
//  무기: 초당 피해 합 × MERGE.dmg. 공격 간격은 재료 무기를 초당 피해로 가중 평균. 공중 공격·범위는 하나라도 있으면 갖는다.
RTS.fuseDef = function (parts, extra = {}) {
  const D = RTS.defs.entities, list = [];
  for (const id of Object.keys(parts)) { if (!D[id]) throw new Error('합체 재료 없음: ' + id); for (let i = 0; i < parts[id]; i++) list.push(D[id]); }
  const sum = f => list.reduce((s, d) => s + f(d), 0), max = f => Math.max(...list.map(f)), cost = {};
  for (const d of list) for (const k of Object.keys(d.cost || {})) cost[k] = (cost[k] || 0) + d.cost[k];
  const ws = list.filter(d => d.weapon).map(d => ({ w: d.weapon, dps: d.weapon.damage / d.weapon.cooldown })), dps = ws.reduce((s, x) => s + x.dps, 0);
  let weapon = null;
  if (ws.length) {
    const cd = ws.reduce((s, x) => s + x.w.cooldown * x.dps, 0) / dps, byDps = ws.slice().sort((a, b) => b.dps - a.dps), ranged = byDps.filter(x => x.w.range > 1), top = ranged[0] || byDps[0];
    weapon = { damage: Math.round(RTS.MERGE.dmg * dps * cd * 10) / 10, cooldown: Math.round(cd * 100) / 100, range: Math.max(...ws.map(x => x.w.range)) };
    if (ws.every(x => x.w.air === false)) weapon.air = false;
    const sp = Math.max(...ws.map(x => x.w.splash || 0)); if (sp) weapon.splash = sp;
    if (top.w.speed) { weapon.speed = top.w.speed; weapon.art = top.w.art; }
    if (extra.weapon) Object.assign(weapon, extra.weapon);
  }
  const out = { kind: 'unit', hp: sum(d => d.hp || 0), armor: max(d => d.armor || 0), speed: Math.min(...list.map(d => d.speed || 1)), sight: max(d => d.sight || 0),
    supply: sum(d => d.supply || 0), cost, tags: (D[Object.keys(parts)[0]].tags || []).slice(), fused: Object.assign({}, parts) };
  if (weapon) out.weapon = weapon;
  const rest = Object.assign({}, extra); delete rest.weapon;
  return Object.assign(out, rest);
};
// 이 유닛이 재료로 쓰이는 합체(같은 진영). 일꾼처럼 곁다리 재료인 유닛에서는 main=true인 것만 고르면 된다
RTS.mergesOf = (G, team, defId) => { const t = G.teams[team]; return t ? Object.values(RTS.defs.merges).filter(m => m.faction === t.faction && m.parts[defId]) : []; };
RTS.mergeBlock = function (G, u, m) { const t = G.teams[u.team];
  if (((t.lvl || {})[m.at] || 0) < 2) return `${RTS.defs.entities[m.at].name} 강화 2단계가 필요합니다`;
  if (u.merging) return '이미 합체 중입니다';
  return ''; };
// 기준 유닛 u와, 가까운 순서로 고른 나머지 재료. miss: [[유닛 id, 부족 수]]
RTS.mergePick = function (G, u, m) {
  const need = Object.assign({}, m.parts), pick = [u]; need[u.def]--;
  const cand = G.ents.filter(o => o !== u && !o.dead && o.team === u.team && need[o.def] > 0 && !o.merging && Math.hypot(o.x - u.x, o.y - u.y) <= RTS.MERGE.range)
    .sort((a, b) => Math.hypot(a.x - u.x, a.y - u.y) - Math.hypot(b.x - u.x, b.y - u.y) || a.id - b.id);
  for (const o of cand) if (need[o.def] > 0) { need[o.def]--; pick.push(o); }
  return { pick, miss: Object.keys(need).filter(k => need[k] > 0).map(k => [k, need[k]]) };
};
RTS.commands.merge = function (G, team, c) {
  const u = G.byId[c.unit], m = RTS.defs.merges[c.recipe], D = RTS.defs.entities;
  if (!u || u.dead || u.team !== team || !m || !m.parts[u.def] || m.faction !== G.teams[team].faction) return;
  const why = RTS.mergeBlock(G, u, m); if (why) { RTS.say(G, team, why, 'warn'); return; }
  const { pick, miss } = RTS.mergePick(G, u, m);
  if (miss.length) { RTS.say(G, team, `합체 재료가 부족합니다(${RTS.MERGE.range}칸 안): ` + miss.map(([k, n]) => D[k].name + ' ' + n + '기').join(', '), 'warn'); return; }
  const job = { id: (G.mergeN = (G.mergeN || 0) + 1), team, recipe: m.id, host: u.id, parts: pick.map(e => e.id), until: G.tick + RTS.MERGE.wait * RTS.HZ };
  for (const e of pick) { e.merging = job.id; e.sieged = false; RTS.issue(G, e, { type: 'merge', job: job.id, host: u.id }); }
  (G.merges = G.merges || []).push(job);
  RTS.say(G, team, `${D[m.into].name} 합체: 재료가 모이는 중`, 'ok');
};
// 재료는 기준 유닛에게 걸어가고, 기준 유닛은 제자리에서 기다린다. 다른 명령을 받으면 합체가 취소된다.
RTS.orders.merge = function (G, u, o) {
  const h = G.byId[o.host]; if (!h || h.dead) { RTS.issue(G, u, null); return; }
  if (h === u) { RTS.stopMove(u); return; }
  if (Math.hypot(u.x - h.x, u.y - h.y) <= RTS.defOf(u).r + RTS.defOf(h).r + .6) RTS.stopMove(u); else RTS.goTo(G, u, h);
};
RTS.fuse = function (G, j, parts, host) {
  const m = RTS.defs.merges[j.recipe], d = RTS.defs.entities[m.into]; let hp = 0;
  for (const e of parts) hp += e.hp;
  const pos = d.air ? { x: host.x, y: host.y } : RTS.nearestFree(G, host.x, host.y), facing = host.facing;
  for (const e of parts) RTS.kill(G, e, null, true);
  const u = RTS.spawn(G, m.into, j.team, pos.x, pos.y); u.hp = Math.min(RTS.stat(G, u, 'hp'), hp); u.facing = facing;
  RTS.emit(G, 'merged', { e: u, from: parts.map(e => e.id) });
  RTS.say(G, j.team, d.name + ' 합체 완료', 'ok');
  return u;
};
RTS.addSystem({ id: 'merge', run(G) {
  if (!G.merges || !G.merges.length) return;
  G.merges = G.merges.filter(j => {
    const parts = j.parts.map(id => G.byId[id]), host = G.byId[j.host];
    const live = parts.every(e => e && !e.dead && e.order && e.order.type === 'merge' && e.order.job === j.id);
    if (!live || G.tick > j.until) {
      for (const e of parts) if (e && !e.dead && e.merging === j.id) { e.merging = 0; if (e.order && e.order.type === 'merge') RTS.issue(G, e, null); }
      RTS.say(G, j.team, live ? '재료가 제때 모이지 못해 합체가 취소되었습니다' : '합체가 취소되었습니다', 'warn'); return false;
    }
    if (!parts.every(e => Math.hypot(e.x - host.x, e.y - host.y) <= RTS.defOf(e).r + RTS.defOf(host).r + 1)) return true;
    RTS.fuse(G, j, parts, host); return false;
  });
} }, { after: 'entities' });

// market.js — 공유 주식시장. 회사 4곳, 총 100주씩, 나와 AI가 같은 물량을 두고 경쟁한다.
// 주가: 평균회귀 + 무작위 변동 + 매매 충격. 배당: 30초마다 실적에 비례. 51주 이상이면 경영권.
RTS.MARKET = { shares: 100 }; // 나머지 수치는 설정 메뉴(RTS.cfg)에서 온다
RTS.initMarket = function (G) {
  const m = G.market = { cos: {}, news: [], nextEvent: 45 * RTS.HZ, nextDiv: G.cfg.divSec * RTS.HZ };
  Object.values(RTS.defs.companies).forEach((c, i) => {
    const s = G.siteSpots[i], d = RTS.defs.entities[c.site]; let site = 0;
    if (s) { let tx = Math.round(s.x - 1.5), ty = Math.round(s.y - 1.5), ok = false;
      for (let r = 0; r < 10 && !ok; r++) for (let dy = -r; dy <= r && !ok; dy++) for (let dx = -r; dx <= r && !ok; dx++) if (RTS.canPlace(G, -1, c.site, tx + dx, ty + dy, 1)) { tx += dx; ty += dy; ok = true; }
      const e = RTS.spawn(G, c.site, -1, tx + 1.5, ty + 1.5); e.built = e.buildT; e.hp = d.hp; e.company = c.id; site = e.id; }
    m.cos[c.id] = { id: c.id, price: c.price, earn: 1, open: c.price, hist: [c.price], shares: G.teams.map(() => 0), free: RTS.MARKET.shares, site, owner: -1 };
  });
};
RTS.fair = (c) => RTS.defs.companies[c.id].price * c.earn;
RTS.dividend = (G, c) => RTS.defs.companies[c.id].price * RTS.defs.companies[c.id].yield * c.earn * RTS.cfg(G).divRate / 100;
function tell(G, text, kind) { for (const t of G.teams) RTS.emit(G, 'notice', { team: t.id, text, kind }); }
RTS.warNews = (G, text) => news(G, text);
function news(G, text) { const m = G.market; m.news.unshift({ t: G.tick, text }); m.news.length = Math.min(m.news.length, 6); tell(G, text, 'market'); }
function syncControl(G, c) {

// 본진 함락: 패전 진영의 사령부가 모두 사라지면 시장 전체에 충격이 온다. 수치는 설정의 '전쟁과 시장'.

RTS.systems.splice(RTS.systems.findIndex(s => s.id === 'cleanup'), 0, { id: 'market', run(G) {
  if (!G.market) RTS.initMarket(G);
  const m = G.market, C = RTS.cfg(G);

  for (const c of Object.values(m.cos)) {
    const d = RTS.defs.companies[c.id], e = G.byId[c.site];
    const g = (RTS.rand(G) + RTS.rand(G) + RTS.rand(G) - 1.5) * 1.15; // 근사 정규분포
    const fair = RTS.fair(c) * (e && e.downUntil > G.tick ? .6 : 1);

// AI 투자: 저평가 종목을 사고, 과열되면 팔고, 과반이 가까우면 인수까지 밀어붙인다.
RTS.aiInvest = function (G, t, diff, ready) {
  const cos = Object.values(G.market.cos), cmd = c => RTS.command(G, t.id, c);
  for (const c of cos) if (c.shares[t.id] && c.owner !== t.id && c.price > RTS.fair(c) * 1.3) { cmd({ type: 'trade', company: c.id, qty: -5 }); return; }

  const score = c => RTS.dividend(G, c) / c.price * (RTS.defs.companies[c.id].resource === 'gas' ? 1.5 : 1) + (foe(c) ? .05 : 0); // 에테르 배당은 광석보다 비싸게 친다

  const pick = chase || cos.filter(c => c.free > 0 && c.owner < 0 && c.price < RTS.fair(c) * 1.1).sort((a, b) => score(b) - score(a))[0];
  if (pick) cmd({ type: 'trade', company: pick.id, qty: 5 });
};

// war.js — 기지 전투의 경제 효과. 사령부 반경 안의 건물과 일꾼이 맞으면 피해액을 계산한다.

RTS.systems.splice(RTS.systems.findIndex(s => s.id === 'market'), 0, { id: 'war', run(G) {
  if (!G.war) RTS.initWar(G); if (G.tick % RTS.HZ) return;
  const W = G.war, C = RTS.cfg(G), D = RTS.defs.entities, hqs = G.ents.filter(e => !e.dead && e.team >= 0 && D[e.def].dropoff && RTS.complete(e)), next = {}; W.total = {};

  for (const h of hqs) { const o = W.bases[h.id] || { eff: 1, lost: 0, lastHit: -9999 }; o.team = h.team; o.main = mainId[h.team] === h.id; o.value = 0; o.res = 0; o.gas = 0; o.n = 0; next[h.id] = o; }
  for (const e of G.ents) { if (e.dead) continue; const d = D[e.def]; if (d.kind === 'unit' && !d.gather) continue; if (d.site) continue;
    let best = null, bd = RTS.WAR.radius; for (const h of hqs) { if (e.team >= 0 && h.team !== e.team) continue; const q = Math.hypot(h.x - e.x, h.y - e.y); if (q < bd) { bd = q; best = h; } } if (!best) continue;
    const o = next[best.id]; if (d.resource) { o.res += e.amount || 0; continue; } o.value += d.gather ? RTS.WAR.workerValue : costValue(d); if (d.kind === 'building') o.n++; if (d.placeOn) o.gas = 1; }

    const drop = Math.min(.05, L / 8000 * C.warMarket / 100); for (const c of cos) c.price = Math.max(1, c.price * (1 - drop));

// diplomacy.js — 중립 진영 자유상단. 지부 위치는 게임마다 섞이고, 정찰로 찾아야 거래할 수 있다.
// 동맹 신청은 베팅이다: 동맹금을 걸고 확률 판정을 받으며, 거절되면 동맹금을 잃는다.
RTS.DIP = { min: 100, full: 600, firstBonus: .15, firstOre: 100, failTrust: .05, cooldown: 45, cap: .9, stakeYield: .06, downSec: 60, spread: .2, allySpread: .1, lot: 50 };
RTS.initDip = function (G) {
  const m = G.dip = { list: {}, rate: 2 }, ids = Object.keys(RTS.defs.branches), spots = (G.postSpots || []).slice();
  for (let i = spots.length - 1; i > 0; i--) { const j = Math.floor(RTS.rand(G) * (i + 1)); [spots[i], spots[j]] = [spots[j], spots[i]]; }
  ids.forEach((id, i) => { const s = spots[i]; if (!s) return;
    let tx = Math.round(s.x - 1.5), ty = Math.round(s.y - 1.5), ok = false;
    for (let r = 0; r < 10 && !ok; r++) for (let dy = -r; dy <= r && !ok; dy++) for (let dx = -r; dx <= r && !ok; dx++) if (RTS.canPlace(G, -1, 'n_post', tx + dx, ty + dy, 1)) { tx += dx; ty += dy; ok = true; }
    const e = RTS.spawn(G, 'n_post', -1, tx + 1.5, ty + 1.5); e.built = e.buildT; e.hp = RTS.defOf(e).hp; e.branch = id;
    m.list[id] = { id, site: e.id, ally: -1, stake: 0, finder: -1, found: G.teams.map(() => false), trust: G.teams.map(() => 0), wait: G.teams.map(() => 0), lockUntil: 0, nextCaravan: 0 }; });
};
RTS.branchKnown = (G, team, e) => team < 0 || G.nofog || !e.branch || (G.dip.list[e.branch].found[team]);
RTS.tradeSpread = function (G, team) { const D = RTS.DIP, L = Object.values(G.dip.list).filter(b => b.ally === team); if (!L.length) return D.spread; return Math.min(...L.map(b => RTS.defs.branches[b.id].perk.spread ?? D.allySpread)); };

RTS.allyChance = function (G, team, id, stake) { const D = RTS.DIP, b = G.dip.list[id], d = RTS.defs.branches[id], k = Math.max(0, Math.min(1, (stake - D.min) / (D.full - D.min)));
  return Math.min(D.cap, d.base + k * .5 + (b.finder === team ? RTS.cfg(G).firstBonus / 100 : 0) + b.trust[team]); };
RTS.allyBlock = function (G, team, id, stake) { const D = RTS.DIP, b = G.dip.list[id], d = RTS.defs.branches[id], t = G.teams[team];
  if (!b.found[team]) return '아직 찾지 못한 지부입니다';
  if (b.ally === team) return '이미 동맹입니다';
  if (b.ally >= 0) return '상대가 먼저 동맹을 맺었습니다';
  if (b.lockUntil > G.tick) return '지부 복구 중입니다';
  if (b.wait[team] > G.tick) return '재신청 대기 ' + Math.ceil((b.wait[team] - G.tick) / RTS.HZ) + '초';
  if (!d.check(G, t)) return '조건 미달: ' + d.need;
  if (stake < D.min) return '동맹금은 최소 ' + D.min + '입니다';

  return null; };
const dipTell = (G, team, text, kind) => RTS.emit(G, 'notice', { team, text, kind });
RTS.commands.ally = function (G, team, c) {
  const block = RTS.allyBlock(G, team, c.branch, c.stake); if (block) { dipTell(G, team, block, 'warn'); return; }
  const D = RTS.DIP, b = G.dip.list[c.branch], d = RTS.defs.branches[c.branch], t = G.teams[team], ok = RTS.rand(G) < RTS.allyChance(G, team, c.branch, c.stake);
  const loss = ok ? c.stake : Math.round(c.stake * RTS.cfg(G).rejectLoss / 100); t.res.ore -= loss; b.wait[team] = G.tick + D.cooldown * RTS.HZ;
  if (!ok) { b.trust[team] = Math.min(.25, b.trust[team] + D.failTrust); t.stats.burned = (t.stats.burned || 0) + loss; dipTell(G, team, `${d.name}가 거절했습니다. 동맹금 ${loss} 손실`, 'warn'); RTS.emit(G, 'allyResult', { team, id: b.id, ok }); return; }
  b.ally = team; b.stake = c.stake; b.nextCaravan = G.tick + 20 * RTS.HZ; const e = G.byId[b.site]; e.team = team;
  for (const o of G.teams) dipTell(G, o.id, o.id === team ? `${d.name}와 동맹 성립` : `${t.name}, ${d.name}와 동맹`, o.id === team ? 'ok' : 'market');
  for (let i = 0; i < (d.perk.mercs || 0); i++) { const p = RTS.nearestFree(G, e.x, e.y + 3); RTS.spawn(G, 'n_merc', team, p.x + (i % 3) * .3, p.y + i * .15); }
  RTS.emit(G, 'allyResult', { team, id: b.id, ok });

RTS.commands.fund = function (G, team, c) { const b = G.dip.list[c.branch], t = G.teams[team]; if (!b || b.ally !== team) return; if (t.res.ore < c.amount) { dipTell(G, team, '광석이 부족합니다', 'warn'); return; } t.res.ore -= c.amount; b.stake += c.amount; };
RTS.commands.barter = function (G, team, c) { // buy: 광석→에테르, 아니면 에테르→광석
  const D = RTS.DIP, t = G.teams[team], b = G.dip.list[c.branch]; if (!b || !b.found[team] || (b.ally >= 0 && b.ally !== team) || b.lockUntil > G.tick) { dipTell(G, team, '이 지부와는 거래할 수 없습니다', 'warn'); return; }

  if (was >= 0) { for (const o of G.teams) dipTell(G, o.id, `${d.name} 지부 파괴, ${G.teams[was].name}의 동맹 해제`, 'market'); }

  for (const u of units) if (!u.order && Math.hypot(u.x - h.x, u.y - h.y) > R.homeR) RTS.issue(G, u, { type: 'move', x: h.x + Math.cos(u.id) * 3.5, y: h.y + Math.sin(u.id) * 3.5 });

    T.nextRaid[t.id] = G.tick + Math.round((R.raidEvery[0] + RTS.rand(G) * (R.raidEvery[1] - R.raidEvery[0])) * RTS.HZ);

} }, { before: 'cleanup' });

// 상대 AI: 부족을 찾으면 70% 확률로 동맹을 노린다. 공병을 보내고, 위치가 필요한 미션은 병력을 보내 돕는다

  if (!L) { if (RTS.tribeBlock(G, t.id)) return; const cur = S.envoy && G.byId[S.envoy]; if (cur && !cur.dead && cur.order && cur.order.type === 'envoy') return;

    if (m.id === 'scout' && !(S.tScoutM && G.byId[S.tScoutM] && G.byId[S.tScoutM].order)) { const u = army.find(x => !D[x.def].air) || army[0]; if (u) { S.tScoutM = u.id; RTS.issue(G, u, { type: 'move', x: m.x, y: m.y }); } } }

// ai.js — 데이터 주도 AI. 진영의 ai 블록(빌드 오더, 병력 비율, 연구 순서)만 읽는다.

  const workers = units.filter(e => D[e.def].gather), army = units.filter(e => !D[e.def].gather && !D[e.def].uncontrollable && e.id !== S.scout);

  const home = hqs[0] || builds[0];

  // 놀고 있는 일꾼 → 채취. 에테르는 추출기당 3명
  const exts = builds.filter(b => D[b.def].placeOn && RTS.complete(b));
  for (const x of exts) { const n = workers.filter(w => w.order && w.order.type === 'gather' && w.order.node === x.id).length;
    if (n < 3) { const w = workers.find(w => w.order && w.order.type === 'gather' && !G.byId[w.order.node]?.vent && !w.cargo); if (w) RTS.issue(G, w, { type: 'gather', node: x.id }); } }
  for (const w of workers) if (!w.order) { const b = hqs[(w.id) % (hqs.length || 1)] || home, n = RTS.nearestNode(G, b.x, b.y, 'ore', 40); if (n) RTS.issue(G, w, { type: 'gather', node: n.id }); }

  const sites = builds.filter(b => !RTS.complete(b));
  const builder = () => workers.find(w => w.order && w.order.type === 'gather' && w.order.phase !== 'mine' && !w.cargo) || workers.find(w => !w.order || w.order.type === 'gather');

    const free = G.bases.filter(b => !G.ents.some(e => D[e.def].kind === 'building' && !e.dead && Math.hypot(e.x - b.x, e.y - b.y) < 7) && RTS.nearestNode(G, b.x, b.y, 'ore', 12));
    free.sort((a, b) => Math.hypot(a.x - home.x, a.y - home.y) - Math.hypot(b.x - home.x, b.y - home.y));
    if (free[0]) { const w = builder(), d = D[f.hq]; if (w) cmd({ type: 'place', ids: [w.id], def: f.hq, tx: Math.round(free[0].x - d.size[0] / 2), ty: Math.round(free[0].y - d.size[1] / 2) }); }

  // 생산
  for (const b of builds) {
    const d = D[b.def]; if (S.saving || !RTS.complete(b) || b.prod.length || !d.trains || d.dropoff) continue;
    const opts = P.army.filter(a => d.trains.includes(a.u) && RTS.techOk(t, D[a.u]) && RTS.canPay(t, D[a.u].cost));
    if (!opts.length) continue;

    for (const o of opts) { r -= o.w; if (r <= 0) { pick = o; break; } }
    if (t.sup + (D[pick.u].supply || 0) * (D[pick.u].count || 1) <= t.cap) cmd({ type: 'train', building: b.id, unit: pick.u });
  }

  for (const id of P.research) {
    if (t.upgrades[id] || t.research[id]) continue;
    const u = RTS.defs.upgrades[id], lab = builds.find(b => (D[b.def].researches || []).includes(id) && RTS.complete(b) && !b.prod.length);
    if (lab && RTS.techOk(t, u) && RTS.canPay(t, u.cost) && t.res.ore > u.cost.ore + 100) cmd({ type: 'research', building: lab.id, upgrade: id });

  let threat = null;
  for (const b of builds) { RTS.query(G, b.x, b.y, 9, o => { if (!threat && !o.dead && RTS.foe(G, t.id, o.team) && D[o.def].kind === 'unit') threat = o; }); if (threat) break; }
  const ids = army.map(u => u.id);
  S.wave = S.wave || diff.waveSize;
  if (threat && !S.attacking) { cmd({ type: 'order', ids: ids.filter(i => { const o = G.byId[i].order; return !o || o.type !== 'amove' || Math.hypot(o.x - threat.x, o.y - threat.y) > 6; }), order: { type: 'amove', x: threat.x, y: threat.y } }); S.defending = G.tick; return; }
  if (G.tick - (S.defending || -999) > 100 && !S.attacking && !threat) { // 집결
    const r = S.rally || (S.rally = (() => { const c = { x: G.w / 2, y: G.h / 2 }; const k = 11 / Math.max(1, Math.hypot(c.x - home.x, c.y - home.y)); return RTS.nearestFree(G, home.x + (c.x - home.x) * k, home.y + (c.y - home.y) * k); })());
    const idle = army.filter(u => !u.order && Math.hypot(u.x - r.x, u.y - r.y) > 5).map(u => u.id);
    if (idle.length) cmd({ type: 'order', ids: idle, order: { type: 'amove', x: r.x, y: r.y } });
  }

    // 적 팀이 여럿이면(중립세력) 공격 대상을 공격마다 번갈아 정한다. 가까운 쪽만 계속 때리지 않게 한다

    let goal = null, bd = 1e12;
    const tg = S.tgt !== undefined && S.tgt >= 0 && G.teams[S.tgt] && G.teams[S.tgt].alive > 0 ? S.tgt : -1;

    if (goal) { const go = army.filter(u => !u.order || u.order.type !== 'amove' || Math.hypot(u.order.x - goal.x, u.order.y - goal.y) > 3).map(u => u.id);
      if (go.length) cmd({ type: 'order', ids: go, order: { type: 'amove', x: goal.x, y: goal.y } }); }
  }
};
RTS.aiSpot = function (G, t, id, near) {

    const a = dir + ((k % 2 ? 1 : -1) * Math.ceil(k / 2)) * .42, x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a) * r);

// net.js — 2인 대전용 lockstep. DOM을 쓰지 않는다(전송 수단은 send 함수로 받는다).
// 원리: 두 기기가 같은 시드·설정으로 같은 게임을 만들고, 입력만 주고받는다.
//  - 시간을 TURN틱 단위 '턴'으로 나눈다. 내 입력은 DELAY턴 뒤 턴에 실행되도록 예약해 상대에게 보낸다.
//  - 어떤 턴은 양쪽 입력 묶음이 모두 도착해야 시작한다. 입력이 없어도 빈 묶음을 보낸다.
//  - HASH_EVERY턴마다 게임 상태 해시를 실어 보내 서로 비교한다. 다르면 onDesync를 부른다.
RTS.NET = { TURN: 2, DELAY: 3, HASH_EVERY: 25 };

// 게임 상태 요약 해시(FNV-1a). 좌표·체력은 소수 셋째 자리까지만 본다.

  for (const e of G.ents) { mix(e.id); mix(e.team); mix(q(e.x)); mix(q(e.y)); mix(q(e.hp)); mix(e.order ? e.order.type.length : 0); mix((e.lv || 0) + (e.rank || 0) * 4 + (e.merging ? 16 : 0)); }

// L = RTS.Lockstep({ team, send:msg=>{}, onDesync:info=>{}, start, carry })

// 상대 메시지는 L.receive(msg). 내 입력은 L.local(cmd).
// 재접속: 남아 있던 기기가 턴 경계(아직 그 턴을 넣기 전)에서 상태를 보내면, 두 기기 모두 그 상태를 복원하고
//   start = 그 턴 번호로 새 Lockstep을 만든다. start 이전 턴의 메시지와 이전 연결의 메시지(epoch가 다름)는 버린다.

  }

    if (n % N.HASH_EVERY === 0) { L.hashes[n] = RTS.stateHash(G); msg.hn = n; msg.h = L.hashes[n]; check(n); }
    o.send(msg);
  }

    const n = L.turnOf(G); flush(G, n);
    const ok = L.mine[n] !== undefined && L.theirs[n] !== undefined; if (!ok) L.stalls++; return ok;
  };
  // 턴 첫 틱에 두 묶음을 팀 번호 순서로 넣는다. 양쪽 기기가 똑같은 순서를 쓰게 하기 위해서다.
  L.inject = G => {
    if (G.tick % N.TURN) return;
    const n = L.turnOf(G), a = L.mine[n], b = L.theirs[n], list = L.team === 0 ? a.concat(b) : b.concat(a);
    for (const c of list) G.cmds.push(c);
    delete L.mine[n]; delete L.theirs[n];
    for (const k of Object.keys(L.hashes)) if (k < n - 200) { delete L.hashes[k]; delete L.theirHashes[k]; }
  };
  L.advance = G => { if (G.over || !L.ready(G)) return false; L.inject(G); RTS.step(G); return true; };
  // 아직 실행되지 않은 내 입력(보낸 묶음 + 대기 중). 재접속 때 새 Lockstep으로 넘긴다
  L.carry = () => { const out = []; for (const k of Object.keys(L.mine).map(Number).sort((a, b) => a - b)) out.push(...L.mine[k]); return out.concat(L.pending).map(c => { const x = Object.assign({}, c); delete x.team; return x; }); };
  return L;
};
// 재접속 지점: 턴 경계이고 그 턴을 아직 넣지 않았을 때만 상태를 보낼 수 있다
RTS.syncPoint = G => G.tick % RTS.NET.TURN === 0;

// 두 사람 게임 시작 옵션. 호스트가 만들어 상대에게 그대로 보낸다.
// hc: 팀별 핸디캡 단계 id(RTS.HANDICAPS), 0번 팀이 호스트.
// 두 사람은 서로 다른 진영을 고르고, 남은 진영이 중립세력(2번 팀 AI)이 된다. 중립세력은 두 방식 모두에 나온다.
//   coop: 두 사람이 같은 편(side 0), 중립세력은 side 1. 아니면 셋이 모두 서로 적이다(마지막까지 남는 쪽이 승리).
//   boost: 보통 AI 대비 성능 배율(기본 1.3), level: 기준 난이도
RTS.COOP = { name: '중립세력', level: 'normal', boost: 1.3, boosts: [1, 1.15, 1.3, 1.5, 1.7] };
RTS.restFaction = used => Object.keys(RTS.defs.factions).find(f => !used.includes(f)) || used[0];
RTS.netGameOpts = function (o) {
  const p = [{ faction: o.factions[0], name: o.names[0], hc: o.hc[0] }, { faction: o.factions[1], name: o.names[1], hc: o.hc[1] }];
  if (o.coop) p.forEach(x => { x.side = 0; });
  const n = { faction: o.enemy || RTS.restFaction(o.factions), name: RTS.COOP.name, ai: o.level || RTS.COOP.level, boost: o.boost || RTS.COOP.boost };
  if (o.coop) n.side = 1;
  p.push(n);
  return { map: o.map, seed: o.seed, settings: o.settings, net: true, coop: !!o.coop, players: p };
};

// terrain.js — 지형 굽기(화면 전용). 게임 시작 때 한 번 계산해 큰 그림 한 장으로 만든다.

RTS.TERRAIN_DECOR = { // 테마별 장식: 풀(grass), 얼음 조각(ice), 마른 덤불(dry), 이끼 포자(spore)

RTS.bakeTerrainHD = function (G, th, themeId, low) {
  const TS = 32, SC = low ? 4 : 2, OUT = low ? .5 : 1, W = G.w * TS / SC, H = G.h * TS / SC, N = W * H;
  let s = (G.seed * 9301 + 49297) >>> 0; const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const gP = th.ground.map(hex), sP = th.sand.map(hex), rP = th.rock.map(hex).map(c => { const g = (c[0] + c[1] + c[2]) / 3; return c.map(v => v + (g - v) * .4); }); // 암벽은 채도를 조금 뺀다
  // 값 노이즈: 256×256 무작위 격자를 부드럽게 보간. 성긴 격자(8px마다)에서만 계산하고 사이는 선형 보간한다.

      h += `<p class="k-sub">연결됨 · 방 ${esc(N.code)}. 방장이 시작하면 바로 시작합니다.</p>` + (lb ? `<dl class="k-netsum"><dt>방식</dt><dd>${lb.coop ? '둘이 협동' : '서로 대전 (셋이 싸움)'}</dd><dt>중립세력</dt><dd>${esc(d.factions[lb.enemy]?.name)} · 보통 AI의 ${Math.round((lb.boost || 1) * 100)}%</dd><dt>전장</dt><dd>${esc(d.maps[lb.map]?.name || lb.map)}</dd><dt>내 진영</dt><dd>${esc(d.factions[lb.factions[1]]?.name)}</dd><dt>${esc(lb.names[0])} 진영</dt><dd>${esc(d.factions[lb.factions[0]]?.name)}</dd><dt>내 핸디캡</dt><dd>${esc(RTS.HANDICAPS[lb.hc[1]]?.name)} · ${esc(RTS.HANDICAPS[lb.hc[1]]?.blurb)}</dd><dt>${esc(lb.names[0])} 핸디캡</dt><dd>${esc(RTS.HANDICAPS[lb.hc[0]]?.name)}</dd></dl>` : '<p class="k-sub">방장 설정을 받는 중…</p>') + st; }
    const vb = verState(N); if (N.stage === 'lobby' && vb) h += `<p class="k-netst bad" role="alert">${vb}</p>`;
    h += `<div class="k-go">${N.role === 'host' && N.stage === 'lobby' ? `<button class="k-primary" id="n-go" ${vb ? 'disabled' : ''}>시작</button>` : ''}${N.stage === 'rejoin' && !N.conn && !N.tryConn ? '<button class="k-primary" id="n-retry">다시 시도</button>' : ''}<button id="n-back">나가기</button></div>`;
    el.innerHTML = h;
    const on = (id, f) => { const x = el.querySelector('#' + id); if (x) x.onclick = f; };
    on('n-back', () => { netClose(true); $('k-start').hidden = false; renderMenu(); });
    on('n-retry', () => { if (N.peer && N.peer.open) { N.miss = 0; netStatus('상대 기기를 찾는 중…'); tryRejoin(N); } else netRejoin({ code: N.code, team: N.team, role: N.role, other: N.other, peerName: N.peerName }); }); on('n-rejoin', () => { const r = loadResume(); if (r) netRejoin(r); });
    on('n-host', () => { saveName(); netHost(); }); on('n-join', () => { saveName(); netJoin(el.querySelector('#n-code').value.trim()); }); on('n-go', () => { unlock(); netBegin(); });
    const code = el.querySelector('#n-code'); if (code) code.onkeydown = e => { if (e.key === 'Enter') { saveName(); netJoin(code.value.trim()); } };
    const pickers = { 'n-map': v => { app.cfg.map = v; store.set('cfg', JSON.stringify(app.cfg)); }, 'n-fac': v => { const lb = lobbyOf(); if (v === lb.factions[1]) N.fac1 = lb.factions[0]; app.cfg.faction = v; store.set('cfg', JSON.stringify(app.cfg)); }, 'n-hc0': v => { N.hc[0] = v; }, 'n-hc1': v => { N.hc[1] = v; },
      'n-mode': v => { N.mode = v; store.set('netMode', v); }, 'n-fac1': v => { if (v === app.cfg.faction) { app.cfg.faction = lobbyOf().factions[1]; store.set('cfg', JSON.stringify(app.cfg)); } N.fac1 = v; }, 'n-boost': v => { N.boost = +v; } };
    for (const id of Object.keys(pickers)) el.querySelectorAll('#' + id + ' [data-v]').forEach(b => { b.onclick = () => { pickers[id](b.dataset.v); sendLobby(); renderNet(); }; });
    $('k-netchat').hidden = N.stage !== 'lobby'; renderChat(); renderVoice(); }
  // 두 기기 버전 비교: 다르면 계산이 어긋나므로 시작을 막는다. 빈 문자열이면 같음
  function verState(N) { const other = N.role === 'host' ? N.peerBuild : N.lobby && (N.lobby.build || '이전 버전'); if (!other || other === RTS.BUILD) return '';
    return `두 기기의 게임 버전이 다릅니다 (이 기기 ${esc(RTS.BUILD || '?')}, 상대 ${esc(other)}). 두 기기 모두 게임 탭을 닫고 다시 연 뒤 방을 새로 만드세요.`; }
  function saveName() { const i = $('k-netp').querySelector('#n-name'); if (i) store.set('name', i.value.trim().slice(0, 12)); }
  // ── 둘이 대전 채팅: 게임 명령(lockstep)과 별도로 연결에 바로 보낸다. 게임 계산에는 영향이 없다 ──
  const QUICK = ['공격!', '도와줘', '잠깐만', '잘했어', 'ㅋㅋㅋ', '좋은 게임!', '한 판 더?'];
  const chat = { list: [] };
  const peerName = () => { const N = app.net; return (N && (N.peerName || (N.role !== 'host' && N.lobby && N.lobby.names[0]))) || '상대'; };
  function chatAdd(mine, name, text) { if (!text) return; chat.list.push({ mine, name, text, at: performance.now() }); if (chat.list.length > 60) chat.list.shift(); renderChat(); setTimeout(renderChat, 9100);
    if (!mine && ac && !muted) { tone(880, 880, .07, 'sine', .05); setTimeout(() => tone(1320, 1320, .09, 'sine', .04), 90); } }
  function chatSend(text) { text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 80); if (!text || !app.net || !app.net.conn || !app.net.conn.open) return false; netSend({ t: 'chat', text }); chatAdd(true, myName(), text); return true; }
  const chatLine = m => `<p class="${m.mine ? 'me' : 'peer'}"><b>${esc(m.mine ? '나' : m.name)}</b>${esc(m.text)}</p>`;
  function renderChat() { const now = performance.now(), open = !$('k-chatbox').hidden;
    $('k-chatlog').innerHTML = chat.list.filter(m => open || now - m.at < 9000).slice(-6).map(chatLine).join('');
    const nl = $('n-chatlog'); nl.innerHTML = chat.list.slice(-40).map(chatLine).join('') || '<p class="k-empty">메시지가 여기에 표시됩니다.</p>'; nl.scrollTop = nl.scrollHeight; }
  function openChat() { if (!app.net || !app.net.conn) return; $('k-chatbox').hidden = false; $('k-chatbtn').classList.add('on'); renderChat(); if (matchMedia('(pointer:fine)').matches) $('k-chatin').focus(); }
  function closeChat() { $('k-chatbox').hidden = true; $('k-chatbtn').classList.remove('on'); $('k-chatin').blur(); if (app.G && !app.demo) view.focus({ preventScroll: true }); renderChat(); }
  $('k-chatbtn').onclick = () => ($('k-chatbox').hidden ? openChat() : closeChat()); $('k-chatx').onclick = closeChat;
  $('k-chatbox').onsubmit = e => { e.preventDefault(); const i = $('k-chatin'); if (chatSend(i.value)) i.value = ''; closeChat(); };
  $('n-chatform').onsubmit = e => { e.preventDefault(); const i = $('n-chatin'); if (chatSend(i.value)) i.value = ''; };
  for (const [id, after] of [['k-quick', closeChat], ['n-quick', null]]) for (const q of QUICK) { const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = () => { chatSend(q); if (after) after(); }; $(id).appendChild(b); }

  // ── 둘이 대전 음성: 각자 자기 마이크를 한 방향 통화로 보낸다(켜는 쪽이 걸고, 받는 쪽은 듣기만). 그래서 켜고 끄기가 서로 독립이다 ──
  const voice = { stream: null, out: null, inCall: null, needTap: false };
  function renderVoice() { const on = !!voice.stream, txt = on ? '마이크 끄기' : '음성 켜기', ttl = (on ? '내 마이크 켜짐' : '내 마이크 꺼짐') + ' · ' + (voice.inCall ? '상대 음성 들림' : '상대 마이크 꺼짐');
    for (const id of ['k-voicebtn', 'n-voice']) { const b = $(id); b.textContent = txt; b.classList.toggle('on', on); b.title = ttl; } applyMusic(); }
  async function voiceToggle() { const N = app.net; if (!N || !N.conn || !N.peer) return; unlock();
    if (voice.stream) { voiceStop(true); notice('마이크를 껐습니다'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { notice('이 브라우저에서는 마이크를 쓸 수 없습니다. https 주소인지, Chrome인지 확인하세요.', 'warn'); return; }
    let st; try { st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false }); }
    catch (e) { notice(e && e.name === 'NotAllowedError' ? '마이크 권한이 거부되었습니다. 주소창 왼쪽 자물쇠 → 권한에서 마이크를 허용하세요.' : e && e.name === 'NotFoundError' ? '이 기기에서 마이크를 찾지 못했습니다.' : '마이크를 열 수 없습니다: ' + ((e && (e.name || e.message)) || '알 수 없음'), 'warn'); return; }
    if (app.net !== N || !N.conn) { st.getTracks().forEach(t => t.stop()); return; }
    voice.stream = st; const call = voice.out = N.peer.call(N.conn.peer, st, { metadata: { kind: 'voice' } });
    if (call) { call.on('close', () => { if (voice.out === call) voiceStop(false); }); call.on('error', () => { if (voice.out === call) { voiceStop(false); notice('음성 연결에 실패했습니다', 'warn'); } }); }
    netSend({ t: 'voice', on: true }); notice('마이크를 켰습니다', 'ok'); renderVoice(); }
  function voiceStop(tell) { const c = voice.out; voice.out = null; if (c) try { c.close(); } catch (e) {} if (voice.stream) voice.stream.getTracks().forEach(t => t.stop()); voice.stream = null; if (tell) netSend({ t: 'voice', on: false }); renderVoice(); }
  function voiceReset() { voiceStop(false); const c = voice.inCall; voice.inCall = null; if (c) try { c.close(); } catch (e) {} $('k-voiceout').srcObject = null; voice.needTap = false; renderVoice(); }
  function onCall(N, call) { if (app.net !== N || !N.conn || call.peer !== N.conn.peer) { try { call.close(); } catch (e) {} return; }
    const old = voice.inCall; voice.inCall = call; if (old) try { old.close(); } catch (e) {}
    call.on('stream', s => { if (voice.inCall !== call) return; const a = $('k-voiceout'); a.srcObject = s; a.volume = app.settings.voiceVol / 100;
      const p = a.play(); if (p) p.then(() => { voice.needTap = false; }).catch(() => { voice.needTap = true; notice('화면을 한 번 누르면 상대 음성이 들립니다', 'warn'); }); renderVoice(); });
    call.on('close', () => { if (voice.inCall === call) { voice.inCall = null; $('k-voiceout').srcObject = null; renderVoice(); } });
    call.on('error', () => {}); call.answer(); renderVoice(); }
  $('k-voicebtn').onclick = voiceToggle; $('n-voice').onclick = voiceToggle;
  // 아무 곳이나 처음 누르면 소리를 연다(브라우저 자동 재생 제한). 막혔던 상대 음성도 이때 다시 튼다
  const anyTap = () => { unlock(); if (voice.needTap) { const p = $('k-voiceout').play(); if (p) p.then(() => { voice.needTap = false; }).catch(() => {}); } };
  root.addEventListener('pointerdown', anyTap, true);
  root.addEventListener('pointerdown', e => { if (app.pop && !$('k-pop').contains(e.target)) { closePop(); app.popShut = performance.now(); } }, true); // 팝업을 닫는 탭은 명령으로 쓰지 않는다
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); }, true); window.addEventListener('keydown', anyTap, true);
  $('k-ver').textContent = '버전 ' + (RTS.BUILD || '개발');

  // ── 루프 ──────────────────────────────────────────────
  function layout() { const r = $('k-stage').getBoundingClientRect(), W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height)); if (view.width !== W || view.height !== H) { view.width = W; view.height = H; clampCam(); } }
  const ro = new ResizeObserver(layout); ro.observe($('k-stage'));
  let lastT = performance.now(), acc = 0, raf = 0, alive = true; const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function loop(now) { if (!alive) return; raf = requestAnimationFrame(loop); const dt = Math.min(250, now - lastT); lastT = now; app.frame++; const G = app.G; if (!G) return;
    if (app.net && (app.net.L || app.net.match) && !app.demo) { // 둘이 대전: 양쪽 입력이 모인 턴만 진행. 늦은 쪽이 따라잡도록 한 프레임에 최대 6틱
      const N = app.net; if (N.match) netTick(N, G);
      if (N.L && !app.paused && !G.over && app.G === G) { acc += dt; const per = 1000 / RTS.HZ; let n = 0, stuck = false; while (acc >= per && n < 6) { if (N.syncTo && RTS.syncPoint(G)) { doSync(); break; } if (!N.L.advance(G)) { stuck = true; acc = Math.min(acc, per * 3); break; } acc -= per; n++; }
        if (stuck) { N.waitMs = (N.waitMs || 0) + dt; } else N.waitMs = 0; $('k-wait').hidden = !(N.waitMs > 700) || !!N.away || !!N.resync; }
      else { acc = 0; $('k-wait').hidden = true; } }
    else if (!app.paused && !G.over && (app.demo || !app.setOpen)) { acc += dt * (app.demo ? 1.5 : app.speed); const per = 1000 / RTS.HZ; let n = 0; while (acc >= per && n < 6) { RTS.step(G); acc -= per; n++; } if (n === 6) acc = 0; }
    if (app.demo) { if (!reduce) { const fight = G.ents.find(e => e.firedAt > G.tick - 20 && RTS.defOf(e).kind === 'unit'); if (fight) { const tx = fight.x * TS - view.width / 2, ty = fight.y * TS - view.height / 2; cam.x += (tx - cam.x) * .006; cam.y += (ty - cam.y) * .006; clampCam(); } } }
    else { const m = app.mouse, sp = 14 / cam.z, e = 12; let dx = 0, dy = 0; if (keys.ArrowLeft) dx = -sp; if (keys.ArrowRight) dx = sp; if (keys.ArrowUp) dy = -sp; if (keys.ArrowDown) dy = sp;
      if (app.settings.edgeScroll && m.inside && !drag.on && matchMedia('(pointer:fine)').matches) { if (m.x < e) dx = -sp; else if (m.x > view.width - e) dx = sp; if (m.y < e) dy = -sp; else if (m.y > view.height - e) dy = sp; }
      if (dx || dy) { cam.x += dx; cam.y += dy; clampCam(); [m.wx, m.wy] = toWorld(m.x, m.y); }
      view.style.cursor = app.mode ? 'crosshair' : 'default';
      if (app.frame % 12 === 0) { renderHud(); // 셋 이상 게임에서 나만 전멸하면 패배를 알리고 관전으로 남는다(두 기기 계산은 계속 돌아야 한다)
        if (G.teams.length > 2 && !G.over && !app.outShown && G.teams[app.team] && G.teams[app.team].alive === 0) { app.outShown = true; finish(null, true); } } }
    if (app.frame % 15 === 0 && !app.demo) renderMini();
    if (music && app.frame % 12 === 0) { if (!app.demo && !G.over) { if (G.ents.some(e => e.team === app.team && e.firedAt > G.tick - 8)) app.heat = Math.max(app.heat || 0, .75); app.heat = (app.heat || 0) * .965; music.setIntensity(Math.max(app.heat, Math.min(.3, G.tick / 20 / 900))); } if (app.frame % 36 === 0) applyMusic(); }
    R.draw(Math.min(1, acc / (1000 / RTS.HZ))); }
  renderMenu(); layout(); demo(); raf = requestAnimationFrame(loop);
  if (opts.autostart) app.start(opts.autostart);
  app.destroy = () => { if (app.net) netClose(true); if (music) music.stop(); window.removeEventListener('keydown', anyTap, true); alive = false; cancelAnimationFrame(raf); ro.disconnect(); window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', offKey); root.innerHTML = ''; };
  return app;
};
</script>
<script>
function boot(data){
  const app=RTS.mount(document.getElementById('kr-app'));
  if(data&&data.save)app.loadState(data.save);
  window.claude?.hot?.snapshot?.(()=>({save:app.saveState()}));
  window.__rts=app;
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
